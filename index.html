    function extractNormalizedTokens(text) {
      if (!text) return [];
      const cleaned = text
        .toLowerCase()
        .replace(/scenario\s*#?\d+\s*:/gi, ' ')
        .replace(/\$?\d+([,\.]\d+)*/g, ' ')
        .replace(/[^a-z\s]/g, ' ');

      return cleaned
        .split(/\s+/)
        .filter(w => w.length > 3 && !COMMON_IGNORE_WORDS.has(w));
    }

    function calculateTokenSimilarity(tokensA, tokensB) {
      if (!tokensA.length || !tokensB.length) return 0;
      const setA = new Set(tokensA);
      const setB = new Set(tokensB);
      let intersection = 0;
      for (const t of setA) {
        if (setB.has(t)) intersection++;
      }
      const union = setA.size + setB.size - intersection;
      return union === 0 ? 0 : intersection / union;
    }

    function filterAndDeduplicateQuestions(candidateQuestions, existingQuestions = [], similarityThreshold = 0.52) {
      const accepted = [];
      let rejectedCount = 0;

      const comparisonPool = existingQuestions.map(q => ({
        id: q.id,
        stemTokens: extractNormalizedTokens(q.question),
        correctOptTokens: extractNormalizedTokens(q.options?.[q.correctIndex] || '')
      }));

      for (const cand of candidateQuestions) {
        const candStemTokens = extractNormalizedTokens(cand.question);
        const candOptTokens = extractNormalizedTokens(cand.options?.[cand.correctIndex] || '');

        let isDuplicate = false;
        for (const existing of comparisonPool) {
          const stemSim = calculateTokenSimilarity(candStemTokens, existing.stemTokens);
          const optSim = calculateTokenSimilarity(candOptTokens, existing.correctOptTokens);

          if (stemSim >= similarityThreshold || (stemSim >= 0.36 && optSim >= 0.68)) {
            isDuplicate = true;
            break;
          }
        }

        if (isDuplicate) {
          rejectedCount++;
        } else {
          accepted.push(cand);
          comparisonPool.push({
            id: cand.id,
            stemTokens: candStemTokens,
            correctOptTokens: candOptTokens
          });
        }
      }

      return { accepted, rejectedCount };
    }

      ['IV', 'Tricky Legal & Tort Traps', 'In a public tender for a highway interchange, Bidder X submits a bid where the itemized schedule of prices clearly lists three phases at $2,000,000 each, but the Total Bid Price line at the bottom is typed as "$600,000" instead of "$6,000,000". The owner’s tender evaluation engineer immediately notices this glaring discrepancy upon opening the bid. How is this error classified under Canadian tendering law?', 'B. A patent error (obvious on the face of the tender), meaning the owner cannot snap up the mistaken bid or forfeit the deposit.', 'A. A non-patent (latent) error that binds Bidder X to build the highway for $600,000 or forfeit its bid bond.', 'C. A criminal offence under the federal Competition Act requiring immediate disqualification.', 'D. An automatic counter-offer that awards Contract B to the second-lowest compliant bidder.', 'An error that is immediately obvious on the face of the tender document itself (such as 3 x $2M written as $600k) is a Patent Error; an offeree cannot snap up an offer knowing it contains a patent mistake.', '【正解：B】因為分項寫明 3 個 200 萬，但總價寫咗 60 萬，審標工程師一打開份標書喺表面就即刻睇得出寫錯（Patent Error）。法律唔容許業主趁火打劫硬食明知寫錯嘅標書。'],
      ['IV', 'Hard Case Study', 'A geotechnical engineering firm prepares a soil investigation report for a developer. The report explicitly states on the cover page: "Prepared solely for preliminary feasibility study; NOT to be relied upon by construction contractors for excavation bidding." Nevertheless, the developer hands the report to bidders. A contractor relies on it, encounters unexpected rock, and sues the geotechnical engineer for negligent misrepresentation. What is the most likely legal outcome?', 'B. The clear, unambiguous disclaimer negates reasonable reliance (under Hedley Byrne v. Heller), shielding the geotechnical engineer from liability to the contractor.', 'A. The geotechnical engineer is strictly liable because disclaimers are never valid in professional reports.', 'C. The contractor wins automatically under the statutory holdback provisions of the Construction Act.', 'D. PEO will automatically revoke the geotechnical engineer’s Certificate of Authorization.', 'Under Hedley Byrne v. Heller, liability for negligent misrepresentation requires reasonable reliance; an explicit disclaimer on the report negates reasonable reliance by third parties.', '【正解：B】考疏忽失實陳述 (Negligent Misrepresentation - Hedley Byrne 案)。因為土力工程師已經喺封面清清楚楚寫明免責聲明限制用途，承建商仲走去信就唔屬於「合理依賴 (Reasonable Reliance)」。'],
      ['VI', 'Standard NPPE', 'In Ontario, which committee within PEO acts as the formal quasi-judicial tribunal that conducts evidentiary hearings, determines whether a member is guilty of professional misconduct or incompetence, and has the statutory power to revoke or suspend a P.Eng. license?', 'B. The Discipline Committee, which serves as the formal adjudicative tribunal conducting hearings and imposing statutory penalties.', 'A. The Complaints Committee, which screens initial public allegations and conducts preliminary investigations.', 'C. The Academic Requirements Committee, which assesses university transcripts and confirmatory exams.', 'D. The Registration Committee, which reviews good character and experience applications for new applicants.', 'The Discipline Committee is the formal adjudication tribunal with statutory authority to hold hearings and impose penalties; the Complaints Committee only investigates and refers.', '【正解：B】Complaints Committee 只負責調查同轉介（無權釘牌或罰款）；Discipline Committee（紀律委員會）先係正式審裁處，有權開庭聆訊、釘牌或罰款！'],
      ['III', 'Standard NPPE', 'Under Ontario’s Occupational Health and Safety Act (OHSA), what are the "Three Fundamental Rights" of every worker in a workplace?', 'B. The right to know about workplace hazards, the right to participate in health and safety, and the right to refuse unsafe work.', 'A. The right to overtime pay, the right to unionize, and the right to paid statutory vacation.', 'C. The right to sue the employer in tort, the right to workers’ compensation, and the right to free parking.', 'D. The right to work from home, the right to flexible hours, and the right to whistleblower financial bonuses.', 'Canadian OH&S legislation grants workers three fundamental rights: 1) The Right to Know, 2) The Right to Participate, and 3) The Right to Refuse Unsafe Work.', '【正解：B】必背職安健勞工三大基本權利 (K-P-R)：1) 知情權 (Right to Know)；2) 參與權 (Right to Participate)；3) 拒絕危險工作權 (Right to Refuse Unsafe Work)。'],
      ['V', 'Standard NPPE', 'Three Professional Engineers decide to form a General Partnership to offer consulting services. One partner, without the knowledge of the other two, negligently designs a retaining wall for a client that collapses and causes $2,000,000 in damages. How are the other two innocent partners legally liable for this debt?', 'C. Under a General Partnership, all partners have unlimited, joint and several personal liability for the wrongful acts and debts of any partner acting in the ordinary course of business.', 'A. They have zero personal liability because they did not personally affix their seal to the retaining wall drawings.', 'B. They are only liable up to the amount of capital they initially invested in the partnership bank account.', 'D. Only the provincial regulator’s statutory indemnity fund is liable for partnership torts.', 'In a General Partnership, each partner has unlimited, joint and several personal liability for debts and torts committed by any partner in the ordinary course of business.', '【正解：C】喺一般合夥企業 (General Partnership) 入面，所有合夥人對其他合夥人喺正常業務範圍內犯下嘅疏忽或債務，都要承擔無限連帶個人責任 (Unlimited joint and several personal liability)！'],
      ['VI', 'Standard NPPE', 'Under Ontario’s Professional Engineers Act, can any licensed P.Eng. with a Certificate of Authorization advertise themselves using the protected title "Consulting Engineer" (顧問工程師)?', 'B. No; "Consulting Engineer" is a restricted designation granted by PEO Council only to P.Eng. members who meet strict additional experience requirements and must be redesignated every 5 years.', 'A. Yes, any P.Eng. who holds an active Certificate of Authorization is automatically a Consulting Engineer.', 'C. Yes, as long as they incorporate a provincial or federal corporation and carry liability insurance.', 'D. No, the title Consulting Engineer was permanently abolished across Canada in 2010.', 'In Ontario (PEO), "Consulting Engineer" is a protected designation requiring Council approval (5+ years P.Eng., 2+ years independent practice, renewed every 5 years).', '【正解：B】喺安省，"Consulting Engineer" 係受法例特別保護嘅專屬頭銜，就算有 P.Eng. 加 C of A 都唔可以亂用，必須向 PEO 額外申請（要求 P.Eng. 滿 5 年及 2 年獨立經驗，每 5 年續期）！'],
      ['I', 'Standard NPPE', 'What is the role of "Engineers Canada" (加拿大工程師總會) in relation to provincial and territorial engineering regulators like PEO, EGBC, and APEGA?', 'B. Engineers Canada is a national federation owned by the 12 provincial/territorial regulators that accredits university programs (CEAB) and develops national guidelines, but has NO statutory authority to issue licenses.', 'A. Engineers Canada is the federal supreme regulator that issues national P.Eng. licenses valid across all provinces.', 'C. Engineers Canada is a national labor union that negotiates collective agreements for federal engineers.', 'D. Engineers Canada is the statutory appellate court that hears appeals from provincial discipline hearings.', 'Regulation of professions is under provincial jurisdiction; Engineers Canada does NOT issue licenses or discipline members.', '【正解：B】加拿大憲法規定專業牌照屬於省級權力。Engineers Canada 絕對無權發牌或處分工程師，主要負責認證大學工程學位（CEAB）同制定全國指引。'],
      ['IV', 'Tricky Legal & Tort Traps', 'In Ontario, a structural engineer negligently designs a foundation in 2006. The building is completed in 2007. No defects are visible for many years. In 2023 (17 years after the negligent design act), a hidden crack finally manifests and is discovered for the first time by the owner, who immediately files a lawsuit in 2023. Assuming there was no willful concealment, how does the Ontario Limitations Act apply?', 'B. The lawsuit is statute-barred because the 15-year Ultimate Limitation Period (measured from the date the negligent act occurred in 2006) has expired.', 'A. The lawsuit is valid because it was filed within the 2-year basic limitation period from the date of discovery in 2023.', 'C. Structural construction defects are exempt from all statutory limitation periods in Canada.', 'D. The basic limitation period allows 6 years from discovery regardless of when the design occurred.', 'While the Basic Limitation Period is 2 years from discovery, Ontario’s Limitations Act imposes a strict 15-year Ultimate Limitation Period from the date the act or omission took place.', '【正解：B】安省訴訟時效雙重時鐘：基本時效係發現後 2 年；但最終時效 (Ultimate Period) 係由錯誤行為發生當日起計 15 年。2006 到 2023 已經過咗 17 年，超過 15 年上限，所以唔可以再告！'],
      ['I', 'Standard NPPE', 'Why does provincial legislation grant engineering associations the power of self-regulation rather than regulating engineers directly through a government ministry?', 'B. Because specialized technical expertise makes peer governance the most effective way to protect the public interest.', 'A. To guarantee minimum salary scales for graduates.', 'C. To grant engineers immunity from civil negligence lawsuits.', 'D. To reduce provincial corporate tax rates for consulting firms.', 'Self-regulation is delegated by statute because licensed peers possess the technical knowledge to set admission and practice standards that protect the public.', '【正解：B】省政府透過法例授權工程界「專業自治 (Self-Regulation)」，係因為工程技術高度專門，由同行監管最能有效保障公眾利益。'],
      ['I', 'Standard NPPE', 'An unlicensed technician performs structural load calculations for a commercial mezzanine that directly affects occupant life safety, without supervision by a P.Eng. Which offence has occurred?', 'B. Unlicensed practice of professional engineering (violating the exclusive scope of practice).', 'A. Breach of copyright under federal law.', 'C. Only a breach of right to title, which is legal if they do not call themselves a P.Eng.', 'D. No offence if the building owner consented.', 'Canadian engineering acts protect BOTH exclusive right to title AND exclusive scope of practice.', '【正解：B】加拿大工程法同時保護「專屬頭銜」及「專屬執業權 (Exclusive Scope of Practice)」。即使無自稱 P.Eng.，無牌獨立進行涉及公眾安全嘅工程設計即屬違法。'],
      ['I', 'Standard NPPE', 'Under Ontario’s Professional Engineers Act, what does the "Industrial Exception" permit an unlicensed employee to do?', 'B. Perform engineering work strictly on machinery or equipment used internally within their employer’s own manufacturing facility to produce products.', 'A. Design public bridges as long as they work for a large corporation.', 'C. Stamp drawings for external residential clients.', 'D. Use the title Professional Engineer on business cards.', 'The industrial exception applies narrowly to internal manufacturing plant operations, not products sold to the public or public infrastructure.', '【正解：B】工業豁免條款（Industrial Exception）只限於工廠內部製造過程所使用嘅機械設備操作，絕不包括向公眾提供工程服務或自稱 P.Eng.。'],
      ['I', 'Standard NPPE', 'A P.Eng. licensed in Alberta (APEGA) is hired to design a permanent foundation in Toronto, Ontario. Under interprovincial mobility rules, what must the engineer do before practicing in Ontario?', 'B. Apply for and obtain licensure (or a temporary/limited license) from PEO before sealing Ontario engineering work.', 'A. Nothing; an APEGA stamp is automatically valid across all provinces without registration.', 'C. Retake all undergraduate engineering exams.', 'D. Register with the federal government.', 'While the Canadian Free Trade Agreement facilitates fast mobility, an engineer must still be licensed by the host province’s regulator (PEO) before practicing there.', '【正解：B】雖然跨省互認協議簡化咗申請程序，但工程師去另一省份執業蓋印前，必須先向當地監管機構（如安省 PEO）申請並獲發牌照。'],
      ['I', 'Standard NPPE', 'What is the primary lesson of the 1907 Quebec Bridge collapse that led to modern engineering rituals and strict supervision standards?', 'B. Divided responsibility, inadequate verification of dead-load recalculations, and ignoring warning signs of chord deflection.', 'A. Using metric instead of imperial units.', 'C. Over-reliance on computer-aided finite element software.', 'D. Hiring unionized ironworkers.', 'The Quebec Bridge collapsed due to underestimated bridge weight, lack of clear field authority, and failure to halt construction when lower chords bent.', '【正解：B】1907年魁北克大橋倒塌係加拿大工程史最重要教訓：源自死載重計算失誤、權責不清以及無視現場構件變形警告。'],
      ['I', 'Standard NPPE', 'Which body is responsible for accrediting undergraduate university engineering programs across Canada?', 'B. The Canadian Engineering Accreditation Board (CEAB) of Engineers Canada.', 'A. The provincial Ministry of Labour.', 'C. The Supreme Court of Canada.', 'D. The Ontario Society of Professional Engineers (OSPE).', 'CEAB (under Engineers Canada) audits and accredits university engineering programs nationwide.', '【正解：B】全國大學工程學位認證由 Engineers Canada 轄下嘅 CEAB（加拿大工程認證委員會）負責。'],
      ['I', 'Standard NPPE', 'How does the mandate of an engineering advocacy society (such as OSPE) differ from that of a regulatory body (such as PEO)?', 'B. Advocacy societies lobby for engineers’ economic and career interests, whereas regulators exist strictly to protect the public interest.', 'A. Advocacy societies issue P.Eng. licenses.', 'C. Regulators negotiate salary collective agreements.', 'D. There is no difference; they are the same organization.', 'Regulators protect the public; advocacy bodies represent the interests of engineers.', '【正解：B】PEO（監管機構）唯一使命係保護公眾；OSPE（倡議學會）則負責為工程師爭取薪酬、就業政策及行業權益。'],
      ['I', 'Standard NPPE', 'What is the meaning of the "Calling of an Engineer" (Iron Ring Ceremony) in Canada?', 'B. A voluntary moral commitment to high professional conduct and humility, separate from statutory P.Eng. licensure.', 'A. It legally grants the P.Eng. license upon graduation.', 'C. It is a mandatory federal government oath.', 'D. It provides professional liability insurance.', 'Written by Rudyard Kipling in 1922, the Ritual of the Calling of an Engineer is a symbolic moral obligation, NOT a legal license to practice.', '【正解：B】鐵戒儀式（Iron Ring）係源於1922年嘅道德自省承諾，提醒工程師謙卑與責任，但唔等於獲得法定 P.Eng. 執業牌照！'],
      ['I', 'Standard NPPE', 'When provincial engineering legislation is described as "Right to Title and Exclusive Scope of Practice", what does this mean for a retired engineer who lets their license lapse?', 'B. They may neither use the designation "P.Eng." nor perform professional engineering work unless they hold a valid retired designation or reinstate their license.', 'A. They can still stamp drawings for friends for free.', 'C. They can use the title "Active P.Eng." indefinitely.', 'D. They can run a consulting firm without a C of A.', 'Once a license is surrendered or lapsed, both title usage and practice rights cease.', '【正解：B】一旦放棄或無續領牌照，就同時失去使用 P.Eng. 頭銜同埋從事專業工程設計嘅合法權利。'],
      ['I', 'Standard NPPE', 'In the 2012 Algo Centre Mall roof collapse in Elliot Lake, Ontario, what major professional failing was highlighted by the public inquiry?', 'B. Allowing client financial constraints to influence an inspection report and altering structural findings to downplay severe water-induced steel corrosion.', 'A. Lack of computer drafting software.', 'C. Failure to register a patent on the roof deck.', 'D. Over-designing the steel beams.', 'The Elliot Lake inquiry highlighted ethical and practice failures where engineers softened inspection conclusions under client pressure despite decades of water leakage and rust.', '【正解：B】Elliot Lake 商場塌頂慘劇揭示：工程師屈服於業主壓力而修改驗樓報告，隱瞞長年漏水導致鋼結構嚴重鏽蝕嘅危險。'],
      ['I', 'Standard NPPE', 'Why are regulatory council meetings and discipline hearings generally open to the public and include government-appointed lay councillors?', 'B. To ensure public transparency, accountability, and prevent the profession from acting as a self-serving guild.', 'A. To sell tickets to raise revenue for the association.', 'C. Because lay councillors perform structural calculations.', 'D. To allow competitors to copy trade secrets.', 'Lay (non-engineer) appointees represent the public voice and ensure self-regulation remains accountable to society.', '【正解：B】引入政府委任嘅非工程界公眾委員（Lay Councillors）及公開紀律聆訊，係為咗確保透明度，防止自我規管變成「官官相衛」。'],
      ['I', 'Standard NPPE', 'Can a graduate with a bachelor’s degree in engineering legally advertise themselves on LinkedIn as a "Professional Engineer" before completing the 48-month licensure process?', 'B. No; using the title "Professional Engineer" or "P.Eng." without an active license is a statutory offence.', 'A. Yes, because a university degree makes you a professional engineer.', 'C. Yes, if they have passed the NPPE.', 'D. Yes, if they work in software.', 'Strict title protection prohibits unlicensed graduates from using "Professional Engineer" or "P.Eng."', '【正解：B】未正式獲批牌照前（就算大學畢業同 Pass 咗 NPPE），自稱 Professional Engineer 或 P.Eng. 即屬違法。'],
      ['I', 'Standard NPPE', 'What is the primary purpose of Continuing Professional Development (CPD) / PEAK programs mandated by Canadian engineering regulators?', 'B. To ensure licensed engineers maintain technical and ethical competence throughout their careers to safeguard the public.', 'A. To generate tuition fees for universities.', 'C. To replace the need for professional liability insurance.', 'D. To rank engineers by salary.', 'Mandatory CPD ensures ongoing competence after initial licensure.', '【正解：B】持續專業進修（如安省 PEAK 計劃）旨在確保工程師拎牌後與時並進，維持保障公眾安全所需嘅專業能力。'],
      ['II', 'Hard Case Study', 'A philosopher argues that a floodway gate should be opened to flood 5 rural farms in order to save a city of 50,000 residents, because it produces the greatest net benefit for the greatest number of people. Which ethical theory does this represent?', 'B. Utilitarianism (John Stuart Mill).', 'A. Duty-based Deontology (Immanuel Kant).', 'C. Rights-based Ethics (John Locke).', 'D. Virtue Ethics (Aristotle).', 'Utilitarianism (Mill) evaluates morality by maximizing overall happiness/utility for the majority.', '【正解：B】功利主義（Utilitarianism - Mill）主張「最大多數人嘅最大利益」，類似工程上嘅成本效益分析。'],
      ['II', 'Hard Case Study', 'Conversely, if an ethicist argues that it is morally wrong to falsify a safety report under any circumstance—even if lying would save jobs—because honesty is a universal categorical imperative, which philosopher’s theory is being applied?', 'B. Immanuel Kant (Duty-Based / Deontological Ethics).', 'A. John Stuart Mill (Utilitarianism).', 'C. Thomas Hobbes.', 'D. Adam Smith.', 'Kant’s Duty Ethics holds that moral duties and universal rules must be followed regardless of consequences.', '【正解：B】康德（Immanuel Kant）嘅義務論（Duty Ethics）強調行為本身必須符合普世道德法則，唔可以因為結果有利而講大話。'],
      ['II', 'Hard Case Study', 'An engineer employed full-time by a municipal transit agency uses the agency’s licensed structural FEM software on her office workstation after 6:00 PM to complete paid consulting jobs for private clients without telling her manager. Why is this unethical?', 'B. Unauthorized use of employer resources for personal gain and undisclosed moonlighting violating the duty of loyalty.', 'A. Software cannot be used after 5:00 PM.', 'C. Municipal engineers are exempt from the Code of Ethics.', 'D. It is ethical as long as she works after regular hours.', 'Using employer software/equipment for private consulting without permission breaches the duty of loyalty and moonlighting rules.', '【正解：B】私自使用公司電腦同正版軟件接私幫 Job（Moonlighting），違反對僱主嘅忠誠義務同資源使用規定。'],
      ['II', 'Hard Case Study', 'Client X hires Engineer B to peer-review a bridge design originally sealed by Engineer A. What ethical obligation applies to Engineer B when conducting this review?', 'B. Act objectively and professionally without maliciously injuring Engineer A’s reputation, while ensuring the client is aware of the review.', 'A. Refuse the assignment because engineers may never review another engineer’s work.', 'C. Secretly alter Engineer A’s sealed drawings.', 'D. Publicly mock Engineer A on social media if an error is found.', 'The Code of Ethics allows reviewing another engineer’s work professionally and fairly without maliciously damaging their reputation.', '【正解：B】工程師可以接受客戶委託審視另一位工程師嘅設計，但必須保持客觀公正，不得惡意中傷同行聲譽。'],
      ['II', 'Hard Case Study', 'While working in a developing country, a Canadian P.Eng. is told by a local port official that her company’s equipment will remain stuck in customs for six months unless she pays an unofficial $5,000 cash payment directly to the official’s personal account. Under Canadian law (CFPOA) and engineering ethics, what must she do?', 'B. Refuse to pay the bribe, as Canadian engineers are bound by Canadian anti-corruption laws (CFPOA) and ethical standards even when working abroad.', 'A. Pay the cash and record it as "concrete testing fees."', 'C. Pay the bribe because local customs override the Code of Ethics.', 'D. Ask a local subcontractor to pay the bribe on her behalf.', 'Under Canada’s Corruption of Foreign Public Officials Act (CFPOA) and the Code of Ethics, bribery of foreign officials is illegal and unethical.', '【正解：B】根據加拿大《反海外腐敗法》(CFPOA) 及工程倫理守則，即使身處海外，行賄外國官員均屬嚴重違法及專業失德。'],
      ['II', 'Standard NPPE', 'A supplier sends a P.Eng. a $15 calendar and a mug bearing the supplier’s corporate logo at Christmas. Is accepting this item a violation of the Code of Ethics?', 'B. No; nominal promotional items of minimal value that do not influence professional judgment are generally acceptable unless prohibited by employer policy.', 'A. Yes; accepting even a $1 pen requires immediate license revocation.', 'C. Only if the mug is made of ceramic.', 'D. Yes, it is a criminal kickback.', 'Nominal promotional items differ from lavish gifts, cash, or travel that create a conflict of interest.', '【正解：B】收受價值極低嘅企業宣傳紀念品（如日曆、水杯）一般唔構成賄賂，但高價禮品、現金或旅遊則嚴格禁止。'],
      ['II', 'Hard Case Study', 'A P.Eng. leaves Consulting Firm Alpha to join Competitor Beta. Which of the following may the engineer ethically take and use at Competitor Beta?', 'B. Her general engineering knowledge, skill, and professional experience gained over her career, but NOT Alpha’s confidential client lists or proprietary design templates.', 'A. A USB drive containing Alpha’s confidential pricing spreadsheets.', 'C. Unreleased CAD files of Alpha’s ongoing projects.', 'D. Alpha’s trade secret algorithms.', 'Departing employees may use their general skills and experience, but post-employment confidentiality prohibits taking trade secrets or client lists.', '【正解：B】轉工時可以帶走個人累積嘅通用工程技能與經驗，但前僱主嘅商業機密、客戶名單及專屬設計模板仍受保密義務保護，嚴禁帶走。'],
      ['II', 'Hard Case Study', 'An electrical engineer specializes exclusively in low-voltage PCB layout. His cousin asks him to design and seal the geotechnical seismic shoring for a 10-story excavation. What does the Code of Ethics require?', 'B. Decline the assignment (or engage a qualified geotechnical specialist), as engineers must only undertake work they are competent to perform by training and experience.', 'A. Watch an online video and seal the shoring drawings anyway.', 'C. Seal the drawings since a P.Eng. license covers all engineering disciplines without restriction.', 'D. Backdate the drawings.', 'Practicing outside one’s area of competence is both unethical and constitutes professional misconduct.', '【正解：B】雖然 P.Eng. 牌照無分科別名稱，但倫理守則同法例嚴格規定：工程師只可承接自己具備足夠訓練與經驗（Competence）嘅工程範疇！'],
      ['II', 'Standard NPPE', 'During a public town hall meeting on a proposed waste-to-energy incinerator, a P.Eng. is hired by an advocacy group to speak. How must the engineer present technical statements to the public?', 'B. Express opinions only on the basis of adequate knowledge and honest conviction, clearly disclosing on whose behalf the engineer is speaking.', 'A. Exaggerate the pollution data by 500% to scare residents.', 'C. Pretend to be an independent neutral citizen without disclosing who paid her.', 'D. Guarantee that the plant has zero risk of ever malfunctioning.', 'Public statements by engineers must be objective, truthful, based on sound engineering fact, and disclose any sponsoring interest.', '【正解：B】向公眾發表工程意見時，必須基於客觀事實與專業知識，並清楚申報自己代表邊個機構發言。'],
      ['II', 'Hard Case Study', 'A P.Eng. discovers that a colleague in the same firm has been falsifying concrete cylinder compression test results on a hospital project. What is the P.Eng.’s ethical duty?', 'B. Act immediately to protect public safety by reporting the falsified structural data to senior management and, if necessary, the regulator.', 'A. Cover up the falsified data out of loyalty to a fellow colleague.', 'C. Blackmail the colleague for a share of his bonus.', 'D. Wait five years until the hospital warranty expires.', 'Paramountcy of public welfare requires immediate intervention when falsified structural data endangers public safety.', '【正解：B】同僚偽造醫院結構石屎測試數據直接威脅公眾生命安全，公眾安全凌駕於同事情誼，必須立即通報制止。'],
      ['II', 'Standard NPPE', 'When a consulting engineer realizes she made a design calculation error that will increase the client’s construction cost by $40,000, what is her ethical obligation?', 'B. Promptly inform the client of the error, propose a technical remediation, and notify her professional liability insurer.', 'A. Hide the error inside a change order blamed on weather.', 'C. Delete the project emails and block the client’s phone number.', 'D. Alter the inspection logs.', 'Duty of candor and fidelity to the client requires prompt disclosure of errors rather than concealment.', '【正解：B】發現自己設計出錯時，誠信原則要求工程師及時向客戶坦誠交代並提出修正方案，同時通知專業責任保險公司。'],
      ['II', 'Standard NPPE', 'Which philosopher is most closely associated with "Rights-Based Ethics," which holds that individuals possess fundamental moral rights to life, liberty, and property that cannot be violated even for the benefit of the majority?', 'B. John Locke.', 'A. Jeremy Bentham.', 'C. Epicurus.', 'D. Niccolò Machiavelli.', 'John Locke formulated Rights Ethics, protecting individual fundamental rights against majority tyranny.', '【正解：B】洛克（John Locke）係「權利倫理學 (Rights Ethics)」代表人物，強調個人基本生命與安全權利不可被多數人利益犧牲。'],
      ['II', 'Hard Case Study', 'An engineering firm submits a proposal for a government contract and lists three senior Ph.D. specialists as the core project team, knowing full well those three specialists retired last year and the work will actually be done by unsupervised interns. What ethical violation is this?', 'B. Misrepresentation of qualifications and bait-and-switch deception in procuring engineering work.', 'A. Smart marketing strategy.', 'C. Equitable estoppel.', 'D. Vicarious liability.', 'Misrepresenting firm personnel or qualifications to win a contract is a direct breach of the Code of Ethics and professional misconduct.', '【正解：B】喺標書入面虛報已離職專家名單（「掛羊頭賣狗肉」騙取合約），屬於嚴重嘅專業資格失實陳述（Misrepresentation）。'],
      ['II', 'Standard NPPE', 'What does the ethical principle of "Environmental Stewardship" require of a Professional Engineer?', 'B. Comply with environmental laws, minimize adverse environmental impacts, and promote sustainable development while balancing societal needs.', 'A. Refuse to design any project that uses electricity or concrete.', 'C. Ignore cost budgets completely on all projects.', 'D. Report only to Greenpeace.', 'Engineers must integrate environmental protection, sustainability, and lifecycle assessment into engineering practice.', '【正解：B】環境管理責任要求工程師遵守環保法規、減低環境負面影響，並推動可持續發展（Sustainable Development）。'],
      ['II', 'Hard Case Study', 'A P.Eng. serves on a municipal zoning board. A real estate developer in which the P.Eng.’s spouse owns 30% of the shares applies to the board for a drainage variance. What must the P.Eng. do?', 'B. Declare the conflict of interest on the official record and completely recuse himself from both the discussion and the vote.', 'A. Vote in favor of the developer since it is his spouse’s company.', 'C. Stay in the room and argue for the project, but abstain from the final hand vote.', 'D. Vote against the project to prove he is tough.', 'For a public board member with a direct family financial interest, full declaration and complete recusal from discussion and voting are required.', '【正解：B】配偶持有申請公司 30% 股份屬直接利益衝突，工程師必須正式申報並完全避席（Recuse），不得參與討論及投票。'],
      ['II', 'Standard NPPE', 'Under the Code of Ethics, how long does an engineer’s duty of confidentiality regarding a client’s proprietary technical information last?', 'B. It continues indefinitely even after the contract or employment relationship ends, unless disclosed by law or client consent.', 'A. Only for 30 days after the invoice is paid.', 'C. It expires as soon as the engineer changes jobs.', 'D. Only for 1 year.', 'The duty of confidentiality survives termination of employment or completion of the client contract.', '【正解：B】保密義務（Duty of Confidentiality）喺合約完結或離職後仍然持續有效，除非獲客戶同意或法律強制要求披露。'],
      ['II', 'Hard Case Study', 'An engineer is asked by a client to sign a Non-Disclosure Agreement (NDA) that prohibits the engineer from reporting illegal toxic waste dumping to the Ministry of the Environment. Is such an NDA clause enforceable over the engineer’s statutory and ethical duty?', 'B. No; a private contract or NDA cannot override statutory reporting obligations or the paramount duty to protect public health and safety.', 'A. Yes; an NDA always supersedes provincial environmental statutes.', 'C. Yes, if the client pays double fees.', 'D. Only if notarized by a lawyer.', 'Contracts cannot lawfully bind an engineer to conceal statutory offences or imminent public health hazards.', '【正解：B】私人保密協議（NDA）絕對唔可以凌駕於法定環保通報義務同埋保障公眾健康安全嘅最高責任之上。'],
      ['II', 'Standard NPPE', 'Aristotle’s "Virtue Ethics" focuses primarily on which aspect of moral decision-making?', 'B. The development of noble moral character, integrity, and finding the "Golden Mean" between extremes.', 'A. Calculating financial net present value.', 'C. Following strict statutory tax tables.', 'D. Maximizing shareholder dividends.', 'Virtue ethics (Aristotle) emphasizes personal moral character and virtues rather than purely rule-based or outcome-based formulas.', '【正解：B】亞里士多德嘅「美德倫理 (Virtue Ethics)」著重個人品格修養、誠信與中庸之道（Golden Mean）。'],
      ['III', 'Hard Case Study', 'A client asks a P.Eng. to issue preliminary structural layout drawings to contractors for rough budgeting. Should the P.Eng. affix her professional seal to these incomplete preliminary drawings?', 'B. No; incomplete or draft documents must NOT be sealed and should be clearly stamped "Preliminary / Not for Construction."', 'A. Yes; every piece of paper leaving an engineering office must be sealed.', 'C. Yes, but cross out the seal with a red pen.', 'D. Seal them using an EIT’s signature.', 'Sealing incomplete or unverified draft drawings is improper; only final engineering documents ready for their intended use should be sealed.', '【正解：B】未完成嘅初步草稿（Draft / Preliminary）絕對唔可以蓋 P.Eng. 印章！應註明「Preliminary - Not for Construction」。'],
      ['III', 'Standard NPPE', 'What is the critical legal distinction between "As-Built Drawings" and "Record Drawings" in professional practice?', 'B. As-Built drawings are red-line markups prepared by the contractor showing field changes, whereas Record Drawings are compiled by the engineer (often with a disclaimer as to unverified contractor inputs).', 'A. They are 100% identical in legal liability.', 'C. Record drawings are prepared before construction begins.', 'D. As-Built drawings must be filed as patents.', 'Engineers must be careful not to blindly seal contractor As-Built markups without clarifying the scope of field verification in Record Drawings.', '【正解：B】As-Built 通常係承建商記錄現場改動嘅紅線圖；Record Drawings 則由工程師整理歸檔，若部分隱蔽工程由判頭提供數據，工程師須清楚註明核實範圍。'],
      ['III', 'Hard Case Study', 'In 1998, a P.Eng. designed a stormwater culvert in full compliance with the 1998 provincial design code and reasonable industry practice at that time. In 2024, the code is updated to require double the capacity, and a storm floods the culvert. If sued in negligence in 2024, by what standard is the engineer’s 1998 design judged?', 'B. Against the reasonable standard of care and engineering standards that existed in 1998 when the design was performed, not 2024 hindsight.', 'A. Strictly against the 2024 updated code.', 'C. Perfection and absolute zero-flooding guarantee.', 'D. Criminal negligence.', 'Standard of care is evaluated based on the knowledge and practice standards prevailing AT THE TIME the service was rendered.', '【正解：B】法庭審視工程師有否違反 Standard of Care，係以當年設計時（1998年）嘅行業標準與知識為準，而唔係用事後孔明（2024年新標準）去倒果為因。'],
      ['III', 'Hard Case Study', 'Under the Occupational Health and Safety Act (OHSA), a factory worker refuses to operate a stamping press because the safety light curtain is broken. What must the employer/supervisor do immediately?', 'B. Investigate the hazard immediately in the presence of the worker and a health and safety representative, and do not penalize or reprisal against the worker.', 'A. Fire the worker immediately for insubordination.', 'C. Dock two weeks of pay from the worker.', 'D. Order another worker to use the press without telling them about the refusal.', 'OHSA strictly protects the Right to Refuse Unsafe Work, mandates an immediate investigation, and prohibits employer reprisals.', '【正解：B】勞工行使「拒絕危險工作權」時，僱主必須即時聯同安全代表在場調查，且嚴禁對員工進行解僱或秋後算賬（No Reprisal）。'],
      ['III', 'Standard NPPE', 'In Canadian environmental and OH&S regulatory prosecutions (which are "Strict Liability" regulatory offences), what is the primary legal defense available to an accused engineer or corporation?', 'B. The defense of Due Diligence (proving on a balance of probabilities that all reasonable care and preventative precautions were taken).', 'A. Claiming ignorance of the law.', 'C. Blaming the weather.', 'D. Claiming the company lost money that quarter.', 'For strict liability regulatory offences, proving Due Diligence is the standard defense.', '【正解：B】面對環保法或職安健嘅「嚴格責任規管控罪 (Strict Liability Offences)」，最重要嘅法定抗辯理由係證明自己已盡「應盡努力 / 合理謹慎 (Due Diligence)」。'],
      ['III', 'Standard NPPE', 'Under Ontario’s Environmental Protection Act, if a tank truck ruptures at an industrial site and discharges 2,000 liters of diesel fuel into a nearby creek, what statutory duty is triggered immediately?', 'B. Forthwith notify the Ministry of the Environment (Spills Action Centre) and the municipality, and take immediate action to contain and clean up the spill.', 'A. Wait 90 days to see if the diesel evaporates naturally.', 'C. Only notify the company’s marketing department.', 'D. Sell the land immediately before anyone notices.', 'Statutory spill reporting requires immediate ("forthwith") notification to environmental authorities and immediate containment/remediation.', '【正解：B】發生污染物洩漏（Spill）進入自然環境時，法例規定必須即時 (Forthwith) 向環境部通報並立即採取圍堵清理措施。'],
      ['III', 'Standard NPPE', 'In Risk Management, risk exposure is fundamentally calculated as the product of which two factors?', 'B. Probability (Likelihood of occurrence) × Consequence (Severity of impact).', 'A. Project Cost × Time Duration.', 'C. Insurance Deductible ÷ Number of Engineers.', 'D. Revenue − Taxes.', 'Engineering risk assessment defines Risk = Probability × Severity/Consequence.', '【正解：B】風險管理基本公式：Risk（風險）= Probability（發生機率）× Consequence / Severity（後果嚴重程度）。'],
      ['III', 'Standard NPPE', 'When dealing with an identified safety hazard on a machine, what is the correct "Hierarchy of Controls" from MOST effective to LEAST effective?', 'B. Elimination -> Substitution -> Engineering Controls (Guards) -> Administrative Controls (Warnings/Training) -> Personal Protective Equipment (PPE).', 'A. PPE -> Warning Signs -> Elimination.', 'C. Administrative Controls -> PPE -> Engineering Controls.', 'D. Insurance -> Litigation -> PPE.', 'Eliminating the hazard physically is always the most effective control; PPE is the last line of defense.', '【正解：B】必背安全控制層級（由最有效到最被動）：1) 消除危險 (Elimination) -> 2) 替代 (Substitution) -> 3) 工程防護裝置 (Engineering Controls) -> 4) 行政管理 -> 5) 個人防護裝備 (PPE)。'],
      ['III', 'Hard Case Study', 'Following the Therac-25 radiation therapy machine accidents (where software race conditions delivered lethal radiation doses to patients), what key software engineering principle was established?', 'B. Software cannot be assumed to be error-free; safety-critical systems require independent hardware interlocks, rigorous hazard analysis, and never relying solely on software to prevent fatal harm.', 'A. Software code never causes physical injury.', 'C. Removing hardware safety interlocks saves money without adding risk.', 'D. Operators should ignore error codes.', 'Therac-25 demonstrated that removing hardware interlocks and relying solely on unverified software in life-critical systems can be fatal.', '【正解：B】Therac-25 醫療輻射機慘劇教訓：切勿移除硬件安全聯鎖（Hardware Interlocks）而單靠軟件控制生死攸關嘅系統！'],
      ['III', 'Standard NPPE', 'What is the purpose of a "Failure Modes and Effects Analysis" (FMEA) in engineering design?', 'B. A systematic, proactive bottom-up method to identify ways components can fail, evaluate their effects on the system, and prioritize corrective design actions.', 'A. A legal lawsuit filed after a contract breach.', 'C. A financial audit of employee travel expenses.', 'D. A trademark registration form.', 'FMEA systematically evaluates potential failure modes, severity, occurrence, and detectability before deployment.', '【正解：B】FMEA（失效模式與影響分析）係一種事前預防性嘅系統化分析工具，用嚟找出零件可能故障嘅方式及其對系統安全嘅影響。'],
      ['III', 'Standard NPPE', 'When a P.Eng. applies an electronic or digital seal to a PDF engineering drawing, what requirement must be satisfied under modern provincial practice guidelines?', 'B. The digital signature/seal must be secure, verifiable, under the sole control of the engineer, and invalidate if the document is altered after signing.', 'A. Anyone in the office should know the engineer’s password so they can stamp files when she is on vacation.', 'C. A plain JPEG image pasted without encryption or signature is always sufficient.', 'D. Digital seals are illegal in all provinces.', 'Electronic seals require cryptographic security and sole control by the licensed P.Eng. so post-signing alterations are detectable.', '【正解：B】電子簽章與蓋印必須由工程師本人獨家控制密碼，具備防篡改驗證功能，絕不可將密碼交予他人代蓋。'],
      ['III', 'Standard NPPE', 'What is the primary distinction between ISO 9001 and ISO 14001?', 'B. ISO 9001 specifies requirements for a Quality Management System (QMS), whereas ISO 14001 specifies requirements for an Environmental Management System (EMS).', 'A. ISO 9001 is for tax accounting and ISO 14001 is for criminal law.', 'C. ISO 9001 guarantees zero product defects by law.', 'D. ISO 14001 is PEO’s licensing exam.', 'ISO 9001 = Quality Management System; ISO 14001 = Environmental Management System.', '【正解：B】常考配對：ISO 9001 係「品質管理系統 (Quality Management)」；ISO 14001 係「環境管理系統 (Environmental Management)」。'],
      ['III', 'Standard NPPE', 'Under the Criminal Code of Canada (Bill C-45 / Westray Bill), when can a corporation or senior engineering manager be convicted of Criminal Negligence causing bodily harm or death?', 'B. When they fail to take reasonable steps to prevent bodily harm while directing work and show wanton or reckless disregard for the lives or safety of workers.', 'A. Whenever any worker sprains an ankle.', 'C. Only if they personally intended to murder a worker.', 'D. Never; corporations cannot be charged under the Criminal Code.', 'Enacted after the Westray Mine disaster, Criminal Code s. 217.1 imposes a legal duty on anyone directing work to take reasonable steps to prevent bodily harm.', '【正解：B】源於 Westray 礦難嘅刑法修訂（Bill C-45）：任何指導工作嘅管理層或公司若罔顧工人生命安全、未採取合理安全措施導致傷亡，可被控刑事疏忽罪！'],
      ['III', 'Standard NPPE', 'What does WHMIS stand for in Canadian workplace safety regulations?', 'B. Workplace Hazardous Materials Information System.', 'A. Western Highway Maintenance Inspection Standard.', 'C. Worker Health Medical Insurance Scheme.', 'D. Water Hydraulics Municipal Infrastructure System.', 'WHMIS provides standardized safety data sheets (SDS) and hazard labels supporting workers’ Right to Know.', '【正解：B】WHMIS（工作場所危險物料資訊系統）透過安全資料表（SDS）同標籤，落實勞工對化學品同危險物嘅「知情權 (Right to Know)」。'],
      ['III', 'Hard Case Study', 'A P.Eng. is retained to design a coastal storm-sewer outfall with a 75-year design life. Historical rainfall tables from 1960 are available, alongside current climate-change hydrological projections showing a 30% increase in extreme storm intensity. What does modern professional practice require?', 'B. Account for reasonably foreseeable climate change impacts and updated hydrological projections rather than relying solely on outdated stationary historical data.', 'A. Ignore climate projections and use only 1960 data because it is cheaper.', 'C. Design the pipe for 5 years only.', 'D. Delegate the sizing to a real estate agent.', 'Engineers Canada national guidelines on climate change adaptation require engineers to consider changing climate risks over the infrastructure’s lifecycle.', '【正解：B】根據現代工程實務指引，設計長壽命基建時必須考慮可預見嘅氣候變化極端天氣預測，不能單靠過時嘅歷史靜態數據。'],
      ['III', 'Standard NPPE', 'How long should an engineering firm retain project design calculations, sealed drawings, and correspondence files after project completion?', 'B. At least for the duration of the applicable Ultimate Limitation Period (e.g., 15+ years in Ontario) and statutory regulatory retention periods.', 'A. Shred all calculations the day after the final invoice is paid.', 'C. Keep them for only 6 months.', 'D. Send them to competitors.', 'Document retention should cover at least the 15-year ultimate limitation period so the firm can defend itself against latent defect claims.', '【正解：B】工程圖紙與計算檔案應至少保存至「最終訴訟時效（安省為 15 年）」過後，否則萬一第 10 年被人告疏忽，公司將無證據自辯！'],
      ['III', 'Standard NPPE', 'In project management, what is the "Critical Path" in a network schedule?', 'B. The longest sequence of dependent activities through a project network that determines the minimum total time required to complete the project (zero float).', 'A. The cheapest path with the most slack time.', 'C. The list of rejected sub-contractors.', 'D. The emergency fire exit route.', 'Activities on the Critical Path have zero total float; delaying any critical path task directly delays the project completion date.', '【正解：B】關鍵路徑（Critical Path）係項目進度表入面工期最長、浮時為零（Zero Float）嘅任務鏈，一旦延誤就會直接推遲整個項目完工期。'],
      ['III', 'Hard Case Study', 'When a P.Eng. signs a "Shop Drawing" review stamp during construction administration, what is the standard scope of the engineer’s review?', 'B. Reviewing for general conformance with the design concept and contract documents, while the contractor remains responsible for fabrication dimensions, means, and methods.', 'A. Assuming 100% liability for every bolt measurement and construction site scaffolding method.', 'C. Replacing the original sealed design drawings.', 'D. Approving extra payment automatically.', 'Shop drawing review checks conformance with the overall design intent; it does not relieve the contractor of responsibility for fabrication dimensions and site safety.', '【正解：B】審批承建商遞交嘅製造圖（Shop Drawings）主要係核對是否符合整體設計概念，並唔會免除承建商對現場施工方法及詳細尺寸核實嘅責任。'],
      ['IV', 'Tricky Legal & Tort Traps', 'Firm A sends a written offer to sell a crane to Firm B for $200,000, open until Friday. On Wednesday, Firm B replies: "We accept your offer at $180,000." Firm A says no. On Thursday, Firm B says: "Fine, we accept your original $200,000 offer." Does a binding contract exist at $200,000?', 'B. No; Firm B’s Wednesday reply at $180,000 was a counter-offer, which legally terminated and killed the original $200,000 offer.', 'A. Yes, because Friday had not yet passed.', 'C. Yes, under the postal acceptance rule.', 'D. Yes, under Quantum Meruit.', 'In contract law, a counter-offer operates as a rejection that extinguishes the original offer; the offeree cannot later revive and accept the dead offer.', '【正解：B】合約法鐵律：還價即殺死原要約 (A counter-offer kills the original offer)！當乙方還價 18 萬被拒後，原本 20 萬嘅 Offer 已經失效。'],
      ['IV', 'Standard NPPE', 'Under the traditional common law "Postal Acceptance Rule" (Mailbox Rule), when does acceptance of an offer by regular mail become legally effective (assuming mail was an authorized mode of communication)?', 'B. At the moment the properly addressed and stamped letter of acceptance is dropped into the mailbox, even before the offeror receives it.', 'A. Only when the offeror opens and reads the letter.', 'C. 30 days after mailing.', 'D. Never; mail cannot form a contract.', 'The Postal Acceptance Rule states that acceptance by post is effective upon posting/dispatch, whereas revocation of an offer is only effective upon receipt.', '【正解：B】郵寄承約法則（Postal Acceptance Rule）：承約信一投入郵筒即刻生效；但撤回要約（Revocation）則必須送達對方手上先至生效！'],
      ['IV', 'Hard Case Study', 'After an engineer finishes designing a parking garage under a fixed-price contract of $80,000, the grateful client says, "You did such a great job last month, I promise to pay you an extra $15,000 bonus next week." The client later changes his mind. Why can the engineer NOT sue to enforce the $15,000 promise?', 'B. Because "Past Consideration is No Consideration"; the engineering work was already completed before the promise was made, so nothing new of value was exchanged.', 'A. Because bonuses are illegal under the Construction Act.', 'C. Because $15,000 exceeds the small claims limit.', 'D. Because the garage was made of concrete.', 'Past consideration (work already performed under an existing duty before the new promise) is not valid legal consideration to support a new contract.', '【正解：B】「過去嘅對價唔算對價 (Past consideration is no consideration)」！工程早就按原合約做完，事後口頭應承送多 $15,000 並無新嘅價值交換，法律上無約束力。'],
      ['IV', 'Tricky Legal & Tort Traps', 'Under the landmark Supreme Court of Canada case M.J.B. Enterprises Ltd. v. Defence Construction (1951) Ltd., what is the legal effect of a "Privilege Clause" ("The lowest or any tender will not necessarily be accepted") in an invitation to tender?', 'B. It allows the owner to consider valid nuanced criteria beyond lowest price, but it does NOT permit the owner to accept a non-compliant bid.', 'A. It gives the owner absolute immunity to award the contract to an unqualified non-compliant bidder.', 'C. It abolishes Contract A completely.', 'D. It allows the owner to engage in secret bid shopping.', 'In M.J.B. Enterprises, the Supreme Court ruled that a privilege clause does not override the implied obligation under Contract A to only accept compliant tenders.', '【正解：B】必考案例 M.J.B. Enterprises：招標書入面嘅「特權條款 (Privilege Clause)」雖然令業主唔一定揀最低價，但絕對唔容許業主接受一份不合規標書 (Non-compliant bid)！'],
      ['IV', 'Hard Case Study', 'During a tender process, after bids are opened, the project owner takes the lowest bidder’s price of $4.2M and secretly calls two other contractors, asking if they will beat $4.2M to win the job. What is this practice called, and how do Canadian courts view it?', 'B. "Bid Shopping," which breaches the implied duty of fairness and good faith owed to bidders under Contract A.', 'A. "Value Engineering," which is praised by courts.', 'C. "Quantum Meruit," which is mandatory.', 'D. "Subrogation," which is a form of insurance.', 'Bid shopping (using submitted bids as leverage to negotiate lower prices post-closing) violates the duty of fairness in Contract A.', '【正解：B】開標後攞住最低標價走去問其他判頭肯唔肯再減價搶標，叫做「壓價競價 (Bid Shopping)」，違反 Contract A 嘅公平誠信原則！'],
      ['IV', 'Hard Case Study', 'A developer urgently asks a consulting engineer to immediately start emergency site drainage design before they have had time to negotiate or agree on a fee schedule. The engineer completes 80 hours of work, and the project is then cancelled. On what legal basis will a court order the developer to pay the engineer a fair market rate?', 'B. Quantum Meruit ("as much as is deserved") to prevent unjust enrichment.', 'A. Liquidated damages.', 'C. Specific performance.', 'D. Res Ipsa Loquitur.', 'When services are requested and performed without a fixed price agreement, courts award reasonable remuneration on a Quantum Meruit basis.', '【正解：B】當客戶要求工程師開工但雙方未傾好價錢，法庭會根據 Quantum Meruit（按勞計酬 / 合理市場價值）判客戶俾錢，防止不當得利。'],
      ['IV', 'Tricky Legal & Tort Traps', 'In the Supreme Court of Canada’s 3-part test from Tercon Contractors Ltd. v. British Columbia, how do courts determine whether an exclusion/limitation of liability clause in a contract is enforceable?', 'B. 1) Does the clause apply to the facts as a matter of interpretation? 2) Was the clause unconscionable at the time the contract was made? 3) Should the court refuse enforcement due to an overriding public policy?', 'A. Exclusion clauses are automatically void whenever a fundamental breach occurs.', 'C. Exclusion clauses are only valid if approved by PEO Council.', 'D. Courts flip a coin.', 'Tercon retired the old "fundamental breach" doctrine and replaced it with a 3-step inquiry: Applicability, Unconscionability, and Overriding Public Policy.', '【正解：B】最高法院 Tercon 案廢除咗舊有嘅「根本違約自動無效論」，改用三部曲測試免責條款：1) 條文字眼是否涵蓋該事故；2) 簽約時有否不公平壓迫 (Unconscionability)；3) 有否違反重大公共政策。'],
      ['IV', 'Standard NPPE', 'When a standard-form contract drafted entirely by a large client contains an ambiguous clause that can reasonably be interpreted in two different ways, which legal rule of interpretation do courts apply?', 'B. Contra Proferentem (the ambiguous clause is interpreted strictly against the party who drafted it).', 'A. Caveat Emptor (let the buyer beware).', 'C. Force Majeure.', 'D. Stare Decisis.', 'Under Contra Proferentem, any ambiguity in a written contract is construed against the drafter.', '【正解：B】Contra Proferentem（對起草方不利原則）：當標準合約條文含糊不清時，法庭會作出對起草該條文一方最不利嘅解釋。'],
      ['IV', 'Tricky Legal & Tort Traps', 'A construction contract states: "If the contractor is late by even 1 day, the contractor shall pay the owner $10,000,000," even though the owner’s actual foreseeable loss from a 1-day delay is only $500. How will a Canadian court treat this $10M clause?', 'B. Strike it down as an unenforceable "Penalty Clause," because it is extravagant and not a genuine pre-estimate of damages (unlike valid Liquidated Damages).', 'A. Enforce the $10,000,000 payment automatically.', 'C. Send the contractor to prison.', 'D. Convert the contract into a partnership.', 'A valid Liquidated Damages clause must be a genuine pre-estimate of foreseeable loss; an extravagant sum meant to terrorize is an unenforceable Penalty Clause.', '【正解：B】合約預定違約金必須係簽約時對損失嘅「真實合理估算 (Liquidated Damages)」；如果金額誇張離譜純粹為咗懲罰恐嚇對方，就會被裁定為無效嘅 Penalty Clause！'],
      ['IV', 'Hard Case Study', 'A contractor agrees to renovate an historic wooden music hall. Halfway through the schedule, a lightning strike completely burns the hall to the ground through no fault of either party. Under what doctrine is the contract discharged?', 'B. Frustration of Contract (an unforeseen supervening event makes performance impossible or radically different from what was agreed).', 'A. Anticipatory Breach.', 'C. Equitable Estoppel.', 'D. Vicarious Liability.', 'Frustration occurs when an unforeseen outside event, without fault of either party, destroys the subject matter and makes performance impossible.', '【正解：B】Frustration of Contract（合約受挫失效）：因非雙方過失嘅突發外在事件（如雷擊燒毀標的物），導致合約根本無法履行，雙方獲免除後續履約義務。'],
      ['IV', 'Hard Case Study', 'In BG Checo International Ltd. v. British Columbia Hydro and Power Authority, the Supreme Court of Canada addressed "Concurrent Liability" in contract and tort. What does Concurrent Liability mean?', 'B. A plaintiff can sue a negligent party in BOTH breach of contract and tort of negligence simultaneously, unless the contract explicitly limits or excludes tort duty.', 'A. If a contract exists, you can never sue in tort.', 'C. You must sue two different companies at the same time.', 'D. Liability is shared equally by the judge and jury.', 'BG Checo established that where a given wrong supports an action in contract and in tort, the party may sue in either or both, unless limited by a valid contract clause.', '【正解：B】BG Checo 案確立「合約與侵權並存責任 (Concurrent Liability)」：除非合約有明確免責條款限制，否則原告可以同時用違約（Contract）及疏忽（Tort）控告對方。'],
      ['IV', 'Tricky Legal & Tort Traps', 'Under Edgeworth Construction Ltd. v. N.D. Lea & Associates Ltd., a highway contractor lost money due to errors in tender design drawings prepared by an engineering firm for the provincial ministry. The contractor sued the engineering firm AND the individual engineers who sealed the drawings. How did the Supreme Court of Canada rule?', 'B. The engineering firm was liable for negligent misrepresentation because the drawings were incorporated into the tender without a disclaimer, BUT the individual salaried engineers who affixed their seals were NOT personally liable in tort.', 'A. The individual employees had to sell their homes to pay the contractor.', 'C. Neither the firm nor the engineers were liable.', 'D. The provincial ministry went to jail.', 'In Edgeworth Construction, the SCC held the consulting firm liable for negligent misrepresentation on tender drawings, while ruling that an employee’s seal alone does not create personal tort liability to third-party contractors.', '【正解：B】必考案例 Edgeworth Construction v. N.D. Lea：最高法院裁定工程顧問公司須就招標圖紙錯誤對承建商負疏忽失實陳述賠償責任，但受僱蓋印嘅個別工程師員工毋須承擔個人民事賠償。'],
      ['IV', 'Standard NPPE', 'Under the ancient strict liability tort rule of Rylands v. Fletcher, when is a landowner liable even without negligence?', 'B. When they bring onto their land for a "non-natural use" something likely to do mischief if it escapes (such as a massive chemical reservoir), and it escapes and causes damage to a neighbor.', 'A. Whenever a wild bird flies over their property.', 'C. Only when a contract is signed.', 'D. When a domestic water pipe drips inside a kitchen.', 'Rylands v. Fletcher imposes strict liability for damage caused by the escape of dangerous substances accumulated during a non-natural use of land.', '【正解：B】侵權法經典 Rylands v. Fletcher（嚴格責任）：若喺土地上進行「非自然用途」並儲存危險物，一旦洩漏波及鄰居，即使無疏忽亦須賠償。'],
      ['IV', 'Standard NPPE', 'What is the difference between Mediation and Binding Arbitration in Alternative Dispute Resolution (ADR)?', 'B. A Mediator is a neutral facilitator who helps parties negotiate a voluntary settlement (cannot impose a decision), whereas an Arbitrator acts like a private judge whose award is legally binding.', 'A. Mediation decisions are enforced by police, while Arbitration is just a casual chat.', 'C. Mediation takes 10 years in public court.', 'D. Arbitration is free of charge by statute.', 'Mediation is non-binding facilitated negotiation; Arbitration produces a binding adjudication outside public courts.', '【正解：B】ADR 比較：調解 (Mediation) 由中立調解員協助雙方自願達成和解，無強制判決權；仲裁 (Arbitration) 則似私人法官，作出具法律約束力嘅裁決。'],
      ['IV', 'Standard NPPE', 'In insurance law, what does the principle of "Subrogation" (代位求償權) allow an insurance company to do?', 'B. After paying an insured client for a loss, the insurer "steps into the shoes" of the client to sue the negligent third party who actually caused the damage.', 'A. Cancel the policy after an accident happens.', 'C. Charge double premiums retroactively.', 'D. Refuse to defend the insured.', 'Subrogation allows the insurer who indemnified the insured to pursue legal recovery against the responsible tortfeasor.', '【正解：B】代位求償權（Subrogation）：當保險公司賠咗錢畀受保業主後，保險公司有權「代位」以業主名義去向闖禍嘅疏忽第三方追討賠償。'],
      ['IV', 'Hard Case Study', 'Why is Professional Liability Insurance (Errors & Omissions / E&O insurance) typically written on a "Claims-Made" basis rather than an "Occurrence" basis?', 'B. A Claims-Made policy covers claims that are first made and reported while the policy is active (regardless of when the past engineering work was done), meaning retiring engineers need run-off coverage.', 'A. It only covers accidents that happen on the exact day the building opens.', 'C. Once you buy 1 year of insurance in 2010, it covers lawsuits filed in 2025 even if you stopped paying premiums in 2011.', 'D. Claims-made policies never require deductibles.', 'E&O insurance is almost always Claims-Made: the policy in force AT THE TIME THE LAWSUIT IS MADE responds, not the policy from years ago when the drawing was sealed.', '【正解：B】工程師專業責任保險（E&O）屬於 Claims-Made Policy（索償提出制）：以「被人入稟索償當日」有冇效保單為準，所以退休或執笠後仍需購買 Run-off 保險。'],
      ['IV', 'Standard NPPE', 'In a construction project, what is the difference between a "Bid Bond", a "Performance Bond", and a "Labour and Material Payment Bond"?', 'B. Bid Bond guarantees the bidder will sign Contract B if selected; Performance Bond guarantees completion of construction if the GC defaults; Labour & Material Bond guarantees subcontractors and suppliers get paid.', 'A. All three are stocks traded on the Toronto Stock Exchange.', 'C. A Performance Bond pays for the engineer’s E&O deductible.', 'D. A Bid Bond lasts for 50 years.', 'Surety bonds are three-party guarantees protecting tendering, completion, and subcontractor payment.', '【正解：B】工程三種擔保（Surety Bonds）：1) Bid Bond：保證中標後簽約；2) Performance Bond：保證大判爛尾時完成工程；3) Labour & Material Payment Bond：保證分判商有糧出。'],
      ['IV', 'Standard NPPE', 'Note that a Surety Bond (such as a Performance Bond) is NOT insurance. If a General Contractor defaults and the Surety pays $2,000,000 to finish the owner’s building, what happens next?', 'B. Under the Indemnity Agreement, the Surety has the legal right to recover the full $2,000,000 from the defaulting General Contractor and its personal indemnitors.', 'A. The Surety absorbs the loss forever just like car insurance.', 'C. The property owner must pay the Surety back.', 'D. PEO pays the Surety.', 'Unlike insurance, suretyship is a credit guarantee: the Surety always has a right of indemnity to recover every dollar paid out from the Principal (contractor).', '【正解：B】極常考陷阱：Surety Bond（工程擔保）唔係保險！如果大判違約搞到擔保公司（Surety）代賠咗 200 萬幫業主埋尾，擔保公司事後會向大判公司及其擔保人追討全數 200 萬！'],
      ['IV', 'Standard NPPE', 'Under Ontario’s Construction Act, what is the effect of a contract clause in which a subcontractor agrees to waive all future statutory construction lien rights before starting work?', 'B. The waiver clause is completely void and unenforceable by statute; statutory lien rights cannot be contracted out of.', 'A. The clause is valid and bars the subcontractor from filing a lien.', 'C. The subcontractor receives double holdback.', 'D. The contract becomes criminal.', 'Provincial construction lien statutes explicitly declare any agreement to waive statutory lien rights to be null and void.', '【正解：B】根據安省《Construction Act》，法定工程留置權（Lien Rights）受法律強制保護，任何要求分判商預先簽字放棄 Lien 權利嘅合約條款一律自動無效 (Void)！'],
      ['IV', 'Hard Case Study', 'A property owner suffers $1,000,000 in loss caused by the combined negligence of a structural engineer (30% at fault) and a soil contractor (70% at fault). Under "Joint and Several Liability" (連帶及各別責任), if the soil contractor goes bankrupt, how much can the plaintiff recover from the structural engineer?', 'B. Up to 100% ($1,000,000) of the plaintiff’s damages, even though the engineer was only 30% at fault.', 'A. Strictly $300,000 maximum.', 'C. Zero, because the main wrongdoer is bankrupt.', 'D. Only the engineer’s design fee.', 'Under Joint and Several Liability for concurrent tortfeasors, any solvent defendant who is even partially at fault can be forced to pay 100% of the plaintiff’s loss if co-defendants are insolvent.', '【正解：B】喺「連帶及各別責任 (Joint and Several Liability)」下，如果佔 70% 責任嘅判頭破產無錢賠，只佔 30% 疏忽責任嘅工程師可能要向原告墊支賠償 100% 全額損失。'],
      ['IV', 'Standard NPPE', 'What does the legal doctrine of "Parol Evidence Rule" state in contract law?', 'B. When parties have reduced their complete agreement to a final, unambiguous written contract, prior verbal negotiations that contradict the written terms cannot be used to vary the contract.', 'A. Verbal contracts are always illegal in Canada.', 'C. Only parole officers can witness engineering contracts.', 'D. Email messages are never admissible in court.', 'The Parol Evidence Rule prevents a party from introducing prior oral promises to contradict a complete, integrated written contract.', '【正解：B】口頭證據法則（Parol Evidence Rule）：當雙方已簽署完整清晰嘅書面合約，簽約前與條文抵觸嘅口頭承諾一般不得用嚟推翻白紙黑字嘅合約內容。'],
      ['IV', 'Standard NPPE', 'If a minor (e.g., a 16-year-old software prodigy) signs a commercial consulting contract to buy $50,000 of server hardware (not a necessity of life), how is the contract classified?', 'B. Voidable at the option of the minor (enforceable by the minor against the adult, but generally not enforceable against the minor).', 'A. Enforceable against the minor’s parents.', 'C. A criminal offence.', 'D. Binding under Ron Engineering.', 'Contracts with minors for non-necessaries are generally voidable at the minor’s option due to lack of legal capacity.', '【正解：B】締約能力（Capacity）：未成年人簽訂非生活必需品嘅商業合約屬於「可撤銷合約 (Voidable at the minor’s option)」。'],
      ['IV', 'Standard NPPE', 'What is the difference between a Breach of a "Condition" (根本條款) and a Breach of a "Warranty" (次要保證條款) in contract law?', 'B. Breaching a fundamental Condition entitles the innocent party to terminate (repudiate) the contract AND sue for damages, whereas breaching a minor Warranty only entitles the innocent party to sue for damages.', 'A. Breaching a Warranty cancels the contract immediately.', 'C. Breaching a Condition carries no financial damages.', 'D. They mean the exact same thing.', 'A Condition goes to the root of the contract (allowing termination + damages); a Warranty is a minor term (allowing damages only, not termination).', '【正解：B】違約後果區分：違反核心條款（Condition）受害方可解除合約並索償；違反次要條款（Warranty）受害方只可索償，但仍須繼續履行合約！'],
      ['IV', 'Standard NPPE', 'What is the legal duty to "Mitigate Damages" when a client breaches an engineering contract?', 'B. The innocent party cannot sit back and let losses pile up; they must take reasonable steps to minimize their financial loss resulting from the breach.', 'A. The innocent party can intentionally maximize costs to punish the breaching party.', 'C. Only the breaching party has to mitigate.', 'D. Mitigation means forgiving the debt completely.', 'A plaintiff claiming breach of contract or tort damages has a legal duty to take reasonable steps to mitigate their avoidable losses.', '【正解：B】減損義務（Duty to Mitigate）：即使對方違約在先，受害方亦有法律責任採取合理措施減少損失擴大。'],
      ['V', 'Hard Case Study', 'Dr. Chen, P.Eng., publishes a conference paper describing her new battery anode invention on May 1, 2025. Eight months later, on January 1, 2026, she files a Canadian patent application. Does her own May 2025 publication destroy the novelty of her Canadian patent application?', 'B. No; Canada provides a 12-month (1-year) grace period for public disclosures made by the inventor prior to the Canadian filing date.', 'A. Yes; any disclosure even 1 day before filing destroys novelty in Canada.', 'C. The grace period in Canada is 10 years.', 'D. Conference papers are protected by Trademarks.', 'Under the Canadian Patent Act, an inventor has a 1-year grace period after their own public disclosure to file in Canada.', '【正解：B】加拿大專利法設有 1 年公開寬限期 (1-Year Grace Period)：發明者自己公開發表論文後 12 個月內喺加拿大提交專利申請，唔會喪失新穎性。'],
      ['V', 'Standard NPPE', 'Which three core criteria must an invention satisfy to be eligible for a Patent in Canada?', 'B. Novel (new), Useful (utility), and Non-obvious (inventive ingenuity to a person skilled in the art).', 'A. Artistic, musical, and dramatic.', 'C. Expensive, secret, and endorsed by PEO.', 'D. Logo-based, distinctive, and renewable.', 'Patentability requires Novelty (New), Utility (Useful), and Non-Obviousness (Inventive Step).', '【正解：B】專利申請三大必備條件：新穎性 (New/Novel)、實用性 (Useful/Utility) 及 非顯而易見性 (Non-obvious)。'],
      ['V', 'Hard Case Study', 'An architect/engineer designs a distinctive public monument. The property owner later puts giant comical neon sunglasses and a fast-food billboard directly onto the sculpture, distorting the creator’s artistic reputation. Even if the owner bought the physical sculpture and economic copyright, what right has been violated?', 'B. The creator’s "Moral Rights" (Right of Integrity and Right of Attribution), which cannot be assigned/sold (though they can be waived in writing).', 'A. Patent infringement.', 'C. Construction lien holdback.', 'D. Vicarious liability.', 'Under the Canadian Copyright Act, Moral Rights stay with the human author even if economic copyright is assigned.', '【正解：B】版權法入面嘅 Moral Rights（精神權利 / 署名及作品完整權）：即使經濟版權已經賣咗畀業主，Moral Rights 不可轉讓 (只可書面放棄 Waive)。'],
      ['V', 'Standard NPPE', 'Which form of Intellectual Property protects the purely visual, ornamental shape, configuration, or pattern applied to a finished manufactured article (such as the distinctive contour shape of an ergonomic drill handle), rather than how it works mechanically?', 'B. Industrial Design (protected for up to 15 years in Canada).', 'A. Patent.', 'C. Trade Secret.', 'D. Integrated Circuit Topography.', 'Industrial Design protects visual aesthetic features of shape/ornamentation on a manufactured article for up to 15 years.', '【正解：B】Industrial Design（工業設計，保護期最長 15 年）專門保護量產產品嘅「視覺外觀與立體形狀線條」，而唔係內部機械功能。'],
      ['V', 'Standard NPPE', 'What is the main advantage of incorporating a business (Corporation) compared to operating as a Sole Proprietorship or General Partnership?', 'B. A Corporation is a separate legal person, giving shareholders limited liability (they generally only risk their investment in shares, not their personal house or savings for corporate debts).', 'A. Corporations are completely exempt from paying income taxes.', 'C. Corporate directors can never be held liable for unpaid employee wages or environmental spills.', 'D. Corporations do not need a Certificate of Authorization to offer engineering to the public.', 'A corporation possesses separate legal personality and limited shareholder liability.', '【正解：B】成立有限公司（Corporation）最大優點係具備獨立法人地位，股東享有有限責任（Limited Liability），公司欠債唔會牽連股東私人樓宇儲蓄。'],
      ['V', 'Hard Case Study', 'Although corporate shareholders enjoy limited liability, under what circumstances can corporate Directors be held PERSONALLY liable by statute in Canada?', 'B. For fraud, unpaid employee wages (up to 6 months) and unremitted source deductions/HST, environmental spills/orders, and OH&S breaches where the director failed to exercise due diligence.', 'A. Directors are never personally liable for anything once incorporated.', 'C. Whenever the company’s stock price drops by 5%.', 'D. Only if the company has fewer than 3 employees.', 'Corporate directors face statutory personal liability for unpaid wages, unremitted payroll taxes/GST, environmental protection orders, and OHSA duties.', '【正解：B】雖然有限公司股東有有限責任，但公司董事 (Directors) 對拖欠員工薪金、環境污染指令、職安健違規及詐騙仍須承擔個人法律責任。'],
      ['V', 'Standard NPPE', 'In Ontario and several Canadian provinces, what does a "Limited Liability Partnership" (LLP) provide to professional partners compared to a traditional General Partnership?', 'B. It shields innocent partners from personal liability for the negligence/malpractice of ANOTHER partner whom they did not supervise, while partners remain personally liable for their own negligence.', 'A. It eliminates the need for a P.Eng. license.', 'C. It makes the government pay all office rent.', 'D. It is identical to a non-profit charity.', 'An LLP protects innocent partners’ personal assets from malpractice claims caused solely by another partner.', '【正解：B】有限責任合夥（LLP）保護無辜合夥人唔使為「其他合夥人犯下嘅專業疏忽」賠上個人身家（但自己犯嘅疏忽仍須個人負責）。'],
      ['V', 'Standard NPPE', 'Under the Ontario Human Rights Code, when an employee with a physical disability requests a modified workstation to perform their engineering duties, up to what legal threshold must the employer accommodate the employee?', 'B. Up to the point of "Undue Hardship" (considering cost, outside sources of funding, and health and safety requirements).', 'A. Only if the modification costs less than $50.', 'C. Employers have no duty to accommodate in engineering firms.', 'D. Until other employees complain.', 'Human rights legislation requires employers to provide reasonable accommodation up to the point of Undue Hardship.', '【正解：B】根據《人權法》，僱主有法律責任為殘疾員工提供合理遷就（Duty to Accommodate），直至構成「過度困難 (Undue Hardship)」。'],
      ['V', 'Standard NPPE', 'How long does registered Trademark protection last in Canada, and can it be renewed?', 'B. 10 years per registration period, and it can be renewed indefinitely every 10 years as long as the mark remains in use and fees are paid.', 'A. 20 years total with no renewal.', 'C. 5 years with no renewal.', 'D. Life of the CEO plus 70 years.', 'Canadian Trademarks last 10 years and are renewable indefinitely every 10 years.', '【正解：B】加拿大註冊商標（Trademark）有效期為 10 年，只要持續使用並繳費，可以每 10 年無限次續期！'],
      ['V', 'Standard NPPE', 'What does the federal Integrated Circuit Topography Act protect?', 'B. The three-dimensional configuration of the electronic circuits embodied in integrated circuit products or layout designs (microchips) for up to 10 years.', 'A. Topographical contour maps of mountains and rivers.', 'C. Highway bridge foundations.', 'D. Company brand slogans.', 'Despite the word "topography", the Integrated Circuit Topography Act protects 3D semiconductor microchip layout designs for up to 10 years!', '【正解：B】經典字面陷阱題：Integrated Circuit Topography Act 保護嘅唔係「地形山脈地圖」，而係「半導體晶片（Microchip）嘅三維積體電路佈局設計」（10年）！'],
      ['V', 'Standard NPPE', 'When a salaried R&D engineer employed specifically to invent new valves creates a patentable valve during work hours using company facilities, who owns the patent rights in the absence of a special contract?', 'B. The employer owns the invention/patent because the employee was specifically hired and paid to invent (or is a senior fiduciary).', 'A. PEO owns the patent.', 'C. Ownership is auctioned to the public.', 'D. The building landlord owns the patent.', 'An employee expressly hired to invent holds inventions made in the course of employment for the employer.', '【正解：B】如果受僱職責本身就係研發發明（Hired to invent），喺工作期間研發出嚟嘅專利預設屬於僱主公司。'],
      ['VI', 'Standard NPPE', 'Under PEO’s licensing requirements in Ontario, what is the standard minimum length of verifiable engineering work experience required for P.Eng. licensure?', 'B. 48 months (4 years) of acceptable engineering experience demonstrating core competencies.', 'A. 6 months of summer internship.', 'C. 15 years of post-doctoral research.', 'D. No experience is required if you pass the NPPE.', 'Licensure generally requires 48 months of progressive, verifiable engineering experience.', '【正解：B】申請 P.Eng. 牌照標準要求具備至少 48 個月（4年）經核實嘅專業工程經驗。'],
      ['VI', 'Standard NPPE', 'What is a "Limited License" (有限制牌照) issued by PEO in Ontario?', 'B. A license granted to an individual who has specialized technical competence authorizing them to practice professional engineering strictly within a narrowly defined scope of services.', 'A. A license that only works on Mondays and Wednesdays.', 'C. A student membership card.', 'D. A license that allows criminal immunity.', 'A Limited License permits an individual to practice and seal engineering work strictly within the specific technical scope stated on their license.', '【正解：B】有限制牌照（Limited License）容許具備特定深厚技術經驗嘅專業人士，嚴格喺牌照列明嘅特定狹窄工程範圍內獨立執業及蓋印。'],
      ['VI', 'Standard NPPE', 'When an out-of-province or international engineer is retained to collaborate on a single specific project in Ontario, which special authorization allows them to practice on that specific project for up to 12 months?', 'B. A Temporary License.', 'A. A Provisional Student Visa.', 'C. An Iron Ring Certificate.', 'D. A Construction Lien.', 'A Temporary License is project-specific and time-limited (up to 12 months) for qualified engineers from other jurisdictions.', '【正解：B】臨時牌照（Temporary License）係按特定單一工程項目及期限（最長12個月）批出，供外地合資格工程師在安省指定項目執業。'],
      ['VI', 'Standard NPPE', 'What is a "Provisional License" in Ontario?', 'B. A license issued to an applicant who has satisfied ALL PEO academic, NPPE exam, and 48-month total experience requirements, EXCEPT the 12 months of Canadian-jurisdiction experience under a P.Eng.', 'A. A license for first-year university freshmen.', 'C. A Certificate of Authorization for a corporation.', 'D. A Consulting Engineer designation.', 'A Provisional License helps internationally trained engineers who have met academic, exam, and general experience requirements obtain their final 12 months of supervised Canadian experience.', '【正解：B】暫准牌照（Provisional License）：發畀已經考晒試、學歷合格並夠經驗，唯一只差「12個月加拿大本地 P.Eng. 監督經驗」嘅申請人。'],
      ['VI', 'Hard Case Study', 'An engineering corporation holds a valid Certificate of Authorization (C of A) from PEO. The sole P.Eng. designated as the professional engineer responsible for the corporation’s engineering work suddenly resigns. What must the corporation do?', 'B. Notify PEO immediately and designate a replacement P.Eng., or cease offering/practicing professional engineering services to the public until a P.Eng. is in charge.', 'A. Continue stamping drawings using the departed engineer’s rubber stamp for the next two years.', 'C. Have the accounting manager sign the engineering drawings.', 'D. Nothing until the C of A expires in 5 years.', 'A C of A requires at least one licensed P.Eng. who assumes professional responsibility; if that person leaves, PEO must be notified promptly.', '【正解：B】持有 C of A 嘅顧問公司必須有指定 P.Eng. 負責監督工程服務；一旦該唯一負責嘅 P.Eng. 離職，公司必須即時通知 PEO 並委任替補 P.Eng.。'],
      ['VI', 'Standard NPPE', 'In PEO discipline proceedings, what is the legal distinction between "Professional Misconduct" and "Incompetence"?', 'B. Professional Misconduct involves violating the Act, regulations, or ethical standards, whereas Incompetence refers to a persistent lack of knowledge, skill, or judgment rendering the member unfit to practice.', 'A. They are 100% identical.', 'C. Incompetence only applies to accounting errors.', 'D. Professional Misconduct is never punished.', 'Misconduct relates to rule/ethical breaches; Incompetence relates to a fundamental deficiency in technical knowledge, skill, or judgment.', '【正解：B】專業失德 (Professional Misconduct) 指違反法規或操守；不稱職 (Incompetence) 指缺乏基本工程知識、技能或判斷力。'],
      ['VI', 'Standard NPPE', 'If the Discipline Committee finds a P.Eng. guilty of professional misconduct and revokes their license, to which body does the engineer have a statutory right of appeal in Ontario?', 'B. The Divisional Court of the Ontario Superior Court of Justice.', 'A. Engineers Canada.', 'C. The Complaints Committee.', 'D. The local city mayor.', 'Decisions of the statutory Discipline Committee tribunal can be appealed to the provincial court (Divisional Court in Ontario).', '【正解：B】如果工程師不服紀律委員會嘅釘牌或處分裁決，有法定權利向省級高等法院（安省為 Divisional Court）提出上訴。'],
