    function cleanOptionBody(optStr) {
      return (optStr || '').replace(/^[A-D][\.\)]\s*/i, '').trim();
    }

    function tightenOverlyVerboseCorrectText(text) {
      return text
        .replace(/\s*\((?:such as|e\.g\.,|including|meaning|which means)[^)]+\)/gi, '')
        .replace(/;\s*however,\s*[^.]+/gi, '')
        .replace(/,\s*whereas\s+[^.]+/gi, (match) => (match.length > 75 ? '' : match))
        .replace(/\s+/g, ' ')
        .trim();
    }

    function normalizeAndBalanceQuestionOptions(questionObj, seedIdx = 0) {
      if (!questionObj || !Array.isArray(questionObj.options) || questionObj.options.length < 4) {
        return questionObj;
      }

      const letters = ['A', 'B', 'C', 'D'];
      const topicClauses = TOPIC_PLAUSIBLE_CLAUSES[questionObj.topicId] || TOPIC_PLAUSIBLE_CLAUSES.IV;
      const correctIdx = questionObj.correctIndex;

      let bodies = questionObj.options.slice(0, 4).map(cleanOptionBody);
      let correctBody = bodies[correctIdx] || '';

      const distractorLengths = bodies.filter((_, i) => i !== correctIdx).map(s => s.length);
      const maxDistractorLen = Math.max(...distractorLengths, 1);

      if (correctBody.length > 125 && correctBody.length > maxDistractorLen * 1.18) {
        const tightened = tightenOverlyVerboseCorrectText(correctBody);
        if (tightened.length >= 45) {
          correctBody = tightened.endsWith('.') ? tightened : `${tightened}.`;
          bodies[correctIdx] = correctBody;
        }
      }

      const targetReferenceLen = Math.max(correctBody.length, 95);

      bodies = bodies.map((body, idx) => {
        if (idx === correctIdx) return body;

        let expanded = body.replace(/\.$/, '').trim();
        const clause1 = topicClauses[(seedIdx + idx) % topicClauses.length];
        const clause2 = topicClauses[(seedIdx + idx + 2) % topicClauses.length];

        const desiredMinLen =
          (seedIdx + idx) % 2 === 0
            ? Math.round(targetReferenceLen * 1.08)
            : Math.round(targetReferenceLen * 0.92);

        if (expanded.length < desiredMinLen) {
          expanded = `${expanded}, ${clause1}`;
        }
        if (expanded.length < desiredMinLen - 15) {
          expanded = `${expanded}, ${clause2}`;
        }

        return expanded.endsWith('.') || expanded.endsWith('?') ? expanded : `${expanded}.`;
      });

      const formattedOptions = bodies.map((b, i) => `${letters[i]}. ${b}`);

      return {
        ...questionObj,
        options: formattedOptions
      };
    }

    function buildInitial110QuestionPool() {
      const pool = CORE_SEED_QUESTIONS.map((q, idx) =>
        normalizeAndBalanceQuestionOptions(q, idx)
      );

      DISTINCT_105_BLUEPRINTS.forEach((bp, idx) => {
        const [topicId, difficulty, question, correctOpt, distractor1, distractor2, distractor3, enExp, zhExp] = bp;
        const qNum = pool.length + 1;

        const rawDistractors = [distractor1, distractor2, distractor3].filter(
          d => d.slice(3) !== correctOpt.slice(3)
        );
        while (rawDistractors.length < 3) {
          rawDistractors.push(
            'D. The party may apply to the provincial Superior Court for an immediate statutory stay of proceedings under the federal Commercial Disputes Act.'
          );
        }

        const targetCorrectSlot = (idx + 1) % 4;
        const letters = ['A', 'B', 'C', 'D'];
        const cleanCorrectText = correctOpt.replace(/^[A-D]\.\s*/, '');
        const cleanDistractors = rawDistractors.slice(0, 3).map(d => d.replace(/^[A-D]\.\s*/, ''));

        const finalOptions = [];
        let dIdx = 0;
        for (let slot = 0; slot < 4; slot++) {
          if (slot === targetCorrectSlot) {
            finalOptions.push(`${letters[slot]}. ${cleanCorrectText}`);
          } else {
            finalOptions.push(`${letters[slot]}. ${cleanDistractors[dIdx++]}`);
          }
        }

        const updatedZhExp = zhExp.replace(/【正解：[A-D]】/, `【正解：${letters[targetCorrectSlot]}】`);

        const rawQ = {
          id: `q-unique-${qNum}`,
          topicId,
          difficulty,
          question,
          options: finalOptions,
          correctIndex: targetCorrectSlot,
          enExplanation: enExp,
          zhExplanation: updatedZhExp,
          trapAnalysis: `核心考點拆解：本題專門測試 ${NPPE_TOPICS.find(t => t.id === topicId)?.code} 嘅獨立實務情境，四個選項長度與法律術語密度已平衡，請仔細分辨正確選項 (${letters[targetCorrectSlot]}) 與高迷惑性干擾項嘅分別。`
        };

        pool.push(normalizeAndBalanceQuestionOptions(rawQ, qNum));
      });

      // Ensure 110 items if needed
      while (pool.length < 110) {
        const base = pool[pool.length % CORE_SEED_QUESTIONS.length];
        pool.push({
          ...base,
          id: `q-pad-${pool.length + 1}`
        });
      }

      return pool.slice(0, 110);
    }

    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    const INITIAL_QUESTIONS = buildInitial110QuestionPool();

    function create20PracticePaper(questionPool, topicFilter = 'ALL') {
      const filtered =
        topicFilter === 'ALL'
          ? questionPool
          : questionPool.filter(q => q.topicId === topicFilter);
      const source = filtered.length >= 20 ? filtered : questionPool;
      const aiQs = source.filter(q => q.isAI);
      const otherQs = shuffleArray(source.filter(q => !q.isAI));
      return [...aiQs, ...otherQs].slice(0, 20);
    }

    function create110ExamConfig(questionPool) {
      const aiQs = questionPool.filter(q => q.isAI);
      const otherQs = shuffleArray(questionPool.filter(q => !q.isAI));
      let combined = [...aiQs, ...otherQs];
      while (combined.length < 110 && INITIAL_QUESTIONS.length > 0) {
        combined = [...combined, ...shuffleArray(INITIAL_QUESTIONS)];
      }
      const paperQuestions = shuffleArray(combined.slice(0, 110));
      const indices = Array.from({ length: paperQuestions.length }, (_, i) => i);
      const shuffledIndices = shuffleArray(indices);
      const unscoredSet = new Set(shuffledIndices.slice(0, Math.min(10, paperQuestions.length)));
      const scoredMap = {};
      paperQuestions.forEach((q, idx) => {
        scoredMap[q.id] = !unscoredSet.has(idx);
      });
      return { paperQuestions, scoredMap };
    }

    // Safe clipboard copy helper that works in local HTML files and iframes
    function copyTextToClipboard(text) {
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }

    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try {
        document.execCommand('copy');
      } catch (e) {}
      document.body.removeChild(ta);
    }

    async function callGeminiAPIWithKey(userApiKey, prompt, systemInstruction, responseSchema = null) {
      const cleanKey = (userApiKey || '').trim();
      if (!cleanKey) {
        throw new Error('NO_API_KEY');
      }
      // Using gemini-2.5-flash for reliable Free Tier Google AI Studio support
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${cleanKey}`;

      const payload = {
        contents: [{ parts: [{ text: prompt }] }],
        systemInstruction: { parts: [{ text: systemInstruction }] }
      };

      if (responseSchema) {
        payload.generationConfig = {
          responseMimeType: "application/json",
          responseSchema: responseSchema
        };
      }

      // Free-tier RPM aware backoff: if HTTP 429 (Rate Limit Exceeded) happens, wait 12s / 20s automatically
      const delays = [4000, 12000, 22000];
      for (let attempt = 0; attempt <= delays.length; attempt++) {
        try {
          const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          if (response.status === 429) {
            throw new Error('RATE_LIMIT_429');
          }
          if (!response.ok) {
            throw new Error(`HTTP_${response.status}`);
          }

          const data = await response.json();
          const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
          if (!text) throw new Error('Empty response from Gemini');
          return responseSchema ? JSON.parse(text) : text;
        } catch (err) {
          if (attempt === delays.length) throw err;
          await new Promise(res => setTimeout(res, delays[attempt]));
        }
      }
    }

          return { scoredTotal: total, scoredCorrect: correct, unscoredTotal: 0, unscoredCorrect: 0, percentage: pct, passed: pct >= 65 };

          const paper = full110Config.paperQuestions;
          const scoredMap = full110Config.scoredMap;
          const scoredQs = paper.filter(q => scoredMap[q.id]);
          const unscoredQs = paper.filter(q => !scoredMap[q.id]);

          const scoredCorrect = scoredQs.filter(q => selectedAnswers[q.id] === q.correctIndex).length;
          const unscoredCorrect = unscoredQs.filter(q => selectedAnswers[q.id] === q.correctIndex).length;

                                  optionStyle = 'bg-red-950/50 border-red-500 text-red-100 ring-1 ring-red-500/50';
                                } else {
                                  optionStyle = 'bg-slate-950/40 border-slate-800/60 text-slate-400';
                                }
                              } else if (isThisSelected) {
                                optionStyle = 'bg-indigo-950/60 border-indigo-500 text-indigo-100 ring-1 ring-indigo-500/50';
                              }

                              return (
                                <button
                                  key={idx}
                                  onClick={() => handleSelectOption(currentQ.id, idx, currentQ.correctIndex)}
                                  className={`w-full text-left p-4 rounded-xl border transition flex items-start justify-between gap-3 ${optionStyle}`}
                                >
                                  <span className="text-sm sm:text-base leading-relaxed">{optionText}</span>
                                  {isRevealed && isThisCorrect && <Check className="w-5 h-5 text-emerald-400 shrink-0 mt-0.5" />}
                                  {isRevealed && isThisSelected && !isThisCorrect && <X className="w-5 h-5 text-red-400 shrink-0 mt-0.5" />}
                                </button>
                              );
                            })}
                          </div>

                          <div className="pt-4 border-t border-slate-800 flex flex-wrap items-center justify-between gap-3">
                            <button
                              onClick={() => setCurrentQIndex(prev => (prev > 0 ? prev - 1 : activeExamQuestions.length - 1))}
                              className="px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs sm:text-sm font-medium flex items-center gap-1.5"
                            >
                              <ChevronLeft className="w-4 h-4" /> 上一題
                            </button>

                            <button
                              onClick={() =>
                                handleAskTutorAboutItem(
                                  `Mock Exam Question (${qTopic?.code})`,
                                  `${currentQ.question}\nOptions:\n${currentQ.options.join('\n')}`
                                )
                              }
                              className="px-4 py-2.5 rounded-xl bg-indigo-600/20 hover:bg-indigo-600/30 text-indigo-300 border border-indigo-500/30 text-xs font-semibold flex items-center gap-1.5"
                            >
                              <MessageSquare className="w-4 h-4" />
                              <span>Ask AI 導師 / 複製去 Gemini App</span>
                            </button>

                            <button
                              onClick={() => setCurrentQIndex(prev => (prev < activeExamQuestions.length - 1 ? prev + 1 : 0))}
                              className="px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs sm:text-sm font-medium flex items-center gap-1.5"
                            >
                              下一題 <ChevronRight className="w-4 h-4" />
                            </button>
                          </div>
                        </div>

                        {isRevealed && (
                          <div className="bg-slate-900 border border-indigo-500/40 rounded-2xl p-6 space-y-4 shadow-xl">
                            <div className="bg-slate-950/70 p-4 rounded-xl border border-slate-800">
                              <p className="text-xs font-bold text-indigo-400 uppercase mb-1">English Explanation:</p>
                              <p className="text-sm text-slate-200 leading-relaxed whitespace-pre-line">{currentQ.enExplanation}</p>
                            </div>
                            <div className="bg-emerald-950/20 p-4 rounded-xl border border-emerald-500/20">
                              <p className="text-xs font-bold text-emerald-400 uppercase mb-1">中文詳解與陷阱分析:</p>
                              <p className="text-sm text-slate-100 leading-relaxed whitespace-pre-line">{currentQ.zhExplanation}</p>
                            </div>
                          </div>
                        )}
                      </div>

                      {/* Right Navigator */}
                      <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 h-fit space-y-4">
                        <div className="flex items-center justify-between">
                          <h3 className="text-sm font-bold text-white">
                            {mockType === 'full110' ? '110 題考卷導覽' : '20 題練習導覽'}
                          </h3>
                          <span className="text-xs font-mono text-indigo-300 font-bold">
                            {activeExamQuestions.filter(q => selectedAnswers[q.id] !== undefined).length}/{activeExamQuestions.length}
                          </span>
                        </div>

                        <div className="grid grid-cols-5 gap-2 max-h-96 overflow-y-auto pr-1">
                          {activeExamQuestions.map((q, idx) => {
                            const ans = selectedAnswers[q.id];
                            const rev = examSubmitted || (mockType === 'daily20' && dailyInstantFeedback && revealedQuestions[q.id]);
                            const isCurrent = idx === safeIndex;

                            let btnColor = 'bg-slate-950 border-slate-800 text-slate-400';
                            if (rev && ans !== undefined) {
                              btnColor =
                                ans === q.correctIndex
                                  ? 'bg-emerald-500/20 border-emerald-500/50 text-emerald-300 font-bold'
                                  : 'bg-red-500/20 border-red-500/50 text-red-300 font-bold';
                            } else if (ans !== undefined) {
                              btnColor = 'bg-indigo-500/20 border-indigo-500/50 text-indigo-300 font-bold';
                            }

                            return (
                              <button
                                key={q.id}
                                onClick={() => setCurrentQIndex(idx)}
                                className={`h-10 rounded-xl border text-xs font-mono transition relative flex items-center justify-center ${btnColor} ${
                                  isCurrent ? 'ring-2 ring-indigo-400' : ''
                                }`}
                              >
                                {idx + 1}
                              </button>
                            );
                          })}
                        </div>
                      </div>
                    </div>
                  );
                })()}
              </div>
            )}

            {}
            {activeTab === 'ai-generator' && (
              <div className="max-w-4xl mx-auto space-y-6">
                {/* Mode Switcher: Gemini App Zero-API Bridge vs Low-RPM Mega-Batch API */}
                <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 space-y-6 shadow-2xl">
                  <div className="flex flex-wrap items-center justify-between gap-4 border-b border-slate-800 pb-5">
                    <div>
                      <h2 className="text-xl font-extrabold text-white flex items-center gap-2">
                        <Sparkles className="w-6 h-6 text-indigo-400" />
                        <span>雙軌試題擴充中心 (免費 API 低 RPM 模式 + Gemini App 免 API 導入)</span>
                      </h2>
                      <p className="text-xs sm:text-sm text-slate-400 mt-1">
                        你可以自由選擇用 <strong>「📋 軌道 A：Gemini App 免 API 複製貼上（100% 零 API 消耗）」</strong> 或者 <strong>「🔑 軌道 B：免費 API 單次大批次生成（每 Call 生 20 題慳 RPM）」</strong>！
                      </p>
                    </div>

                    <div className="flex items-center gap-2 bg-slate-950 p-1.5 rounded-2xl border border-slate-800">
                      <button
                        onClick={() => setAiModeTab('manual')}
                        className={`px-4 py-2.5 rounded-xl text-xs font-bold transition flex items-center gap-2 ${
                          aiModeTab === 'manual'
                            ? 'bg-emerald-600 text-white shadow-lg'
                            : 'text-slate-400 hover:text-slate-200'
                        }`}
                      >
                        <ClipboardPaste className="w-4 h-4" />
                        <span>📋 軌道 A：Gemini App 免 API 導入 (推薦！零 Quota 消耗)</span>
                      </button>

                      <button
                        onClick={() => setAiModeTab('api')}
                        className={`px-4 py-2.5 rounded-xl text-xs font-bold transition flex items-center gap-2 ${
                          aiModeTab === 'api'
                            ? 'bg-indigo-600 text-white shadow-lg'
                            : 'text-slate-400 hover:text-slate-200'
                        }`}
                      >
                        <KeyRound className="w-4 h-4" />
                        <span>🔑 軌道 B：免費 API 大批次低 RPM 模式</span>
                      </button>
                    </div>
                  </div>

                  {/* Shared Topic & Difficulty Filters */}
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div>
                      <label className="block text-xs font-bold text-slate-300 uppercase mb-1.5">
                        1. 選擇考試課題 (Topic)
                      </label>
                      <select
                        value={genTopicId}
                        onChange={e => setGenTopicId(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-xs sm:text-sm text-white"
                      >
                        <option value="ALL">🔥 All 6 Topics Mixed (六大課題綜合)</option>
                        {NPPE_TOPICS.map(t => (
                          <option key={t.id} value={t.id}>
                            {t.code}: {t.name} ({t.zhName})
                          </option>
                        ))}
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-300 uppercase mb-1.5">
                        2. 試題難度 (Difficulty)
                      </label>
                      <select
                        value={genDifficulty}
                        onChange={e => setGenDifficulty(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-xs sm:text-sm text-white"
                      >
                        <option value="Hard Case Study">Hard Case Study (長篇工程案例)</option>
                        <option value="Tricky Legal & Tort Traps">Tricky Legal & Tort Traps (合約/侵權陷阱)</option>
                        <option value="Standard NPPE">Standard NPPE (標準概念題)</option>
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-300 uppercase mb-1.5">
                        3. 特別指定考點 (Optional)
                      </label>
                      <input
                        type="text"
                        value={genFocusConcept}
                        onChange={e => setGenFocusConcept(e.target.value)}
                        placeholder="如: Ron Engineering, Holdback..."
                        className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-xs sm:text-sm text-white"
                      />
                    </div>
                  </div>

                  {/* TRACK A: GEMINI APP ZERO-API COPY & PASTE BRIDGE */}
                  {aiModeTab === 'manual' && (
                    <div className="space-y-5 pt-2">
                      <div className="bg-emerald-950/30 border border-emerald-500/40 rounded-2xl p-5 space-y-4">
                        <div className="flex flex-wrap items-center justify-between gap-2">
                          <div>
                            <h3 className="text-sm sm:text-base font-bold text-emerald-300">
                              步驟 1：一鍵複製「NPPE 專用生題 Prompt」去你個 Gemini App / 網頁版
                            </h3>
                            <p className="text-xs text-slate-300 mt-0.5">
                              呢段 Prompt 已經自動幫你寫入咗「防撞題清單」、「強制 4 個選項字數相同（唔准最長係答案）」同埋「中英對照 JSON 格式」。喺 Gemini App 一次過生成 20–25 題完全唔計 API Quota！
                            </p>
                          </div>
                          <button
                            type="button"
                            onClick={() => {
                              copyTextToClipboard(geminiAppSuperPrompt);
                              notify('📋 已複製超級 Prompt！而家可以打開 Gemini App 貼上 (Ctrl+V) 生成題目！', 'success');
                            }}
                            className="px-4 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold flex items-center gap-2 shadow-lg shrink-0"
                          >
                            <Copy className="w-4 h-4" />
                            <span>一鍵複製 Prompt 去 Gemini App</span>
                          </button>
                        </div>

                        <textarea
                          readOnly
                          value={geminiAppSuperPrompt}
                          rows={5}
                          className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs font-mono text-slate-300 focus:outline-none"
                        />
                      </div>

                      <div className="bg-slate-950/90 border border-indigo-500/40 rounded-2xl p-5 space-y-4">
                        <div>
                          <h3 className="text-sm sm:text-base font-bold text-indigo-300">
                            步驟 2：將 Gemini App 吐出嚟嘅 JSON 貼返落下面 ➔ 自動去重、平衡選項並加時！
                          </h3>
                          <p className="text-xs text-slate-400 mt-0.5">
                            就算連埋前後嘅 ```json 標記一齊複製貼落嚟都得，系統會自動提取入面嘅題目陣列、過濾重複題、平衡 A/B/C/D 長度，並按每題 +1.5 分鐘自動幫你加時！
                          </p>
                        </div>

                        <textarea
                          value={pastedGeminiJson}
                          onChange={e => setPastedGeminiJson(e.target.value)}
                          rows={6}
                          placeholder='喺呢度貼上 Gemini App 輸出嘅 [ { "topicId": "IV", "question": "...", ... } ] JSON 內容...'
                          className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3.5 text-xs font-mono text-white focus:outline-none focus:border-indigo-500"
                        />

                        <button
                          type="button"
                          onClick={handleImportFromGeminiAppPaste}
                          className="w-full py-3.5 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold text-sm shadow-xl transition flex items-center justify-center gap-2"
                        >
                          <ClipboardPaste className="w-5 h-5" />
                          <span>立即解析並導入題庫 (自動去重 + 平衡選項長度 + 自動加時)</span>
                        </button>
                      </div>
                    </div>
                  )}

                  {/* TRACK B: LOW-RPM MEGA-BATCH API GENERATOR */}
                  {aiModeTab === 'api' && (
                    <div className="space-y-5 pt-2">
                      <div className="bg-indigo-950/30 border border-indigo-500/30 rounded-2xl p-4 space-y-3">
                        <div className="flex flex-wrap items-center justify-between gap-2">
                          <span className="text-xs font-bold text-indigo-300 uppercase">
                            ⚡ 免費 API 防爆 RPM 設定 (Mega-Batch per Request)
                          </span>
                          <span className="text-xs text-emerald-400 font-mono">
                            目前預計只需 {Math.ceil(genCount / questionsPerApiCall)} 次 API Call！
                          </span>
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                          <div>
                            <label className="block text-[11px] text-slate-400 mb-1">目標總題數 (Total Questions)</label>
                            <select
                              value={genCount}
                              onChange={e => setGenCount(Number(e.target.value))}
                              disabled={isGeneratingQs}
                              className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white font-bold"
                            >
                              <option value={20}>一次生 20 題 (+30 分鐘)</option>
                              <option value={40}>一次生 40 題 (+60 分鐘)</option>
                              <option value={60}>一次生 60 題 (+90 分鐘)</option>
                            </select>
                          </div>

                          <div>
                            <label className="block text-[11px] text-slate-400 mb-1">每次 API Request 題數 (慳 RPM)</label>
                            <select
                              value={questionsPerApiCall}
                              onChange={e => setQuestionsPerApiCall(Number(e.target.value))}
                              disabled={isGeneratingQs}
                              className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-emerald-300 font-bold"
                            >
                              <option value={15}>每 1 Call 生 15 題</option>
                              <option value={20}>每 1 Call 生 20 題 (推薦慳 RPM)</option>
                              <option value={25}>每 1 Call 生 25 題 (最慳 RPM)</option>
                            </select>
                          </div>

                          <div>
                            <label className="block text-[11px] text-slate-400 mb-1">批次之間冷卻間隔 (防 429)</label>
                            <select
                              value={rpmCooldownSec}
                              onChange={e => setRpmCooldownSec(Number(e.target.value))}
                              disabled={isGeneratingQs}
                              className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-amber-300 font-bold"
                            >
                              <option value={6}>冷卻 6 秒</option>
                              <option value={12}>冷卻 12 秒 (極安全)</option>
                              <option value={0}>無冷卻 (只生 1 批時適用)</option>
                            </select>
                          </div>
                        </div>
                      </div>

                      {isGeneratingQs && qBatchProgress && (
                        <div className="bg-slate-950 border border-indigo-500/50 rounded-2xl p-4 space-y-2">
                          <div className="flex items-center justify-between text-xs">
                            <span className="text-indigo-300 font-bold flex items-center gap-2">
                              <Loader2 className="w-4 h-4 animate-spin" />
                              {qBatchProgress.cooldownRemaining > 0
                                ? `⏳ 免費 API RPM 保護冷卻中 (${qBatchProgress.cooldownRemaining}s)...`
                                : `正在單次請求生成 ${questionsPerApiCall} 題 (第 ${qBatchProgress.batchNum}/${qBatchProgress.totalBatches} 次 API Call)...`}
                            </span>
                            <span className="font-mono text-emerald-400 font-bold">
                              已完成 {qBatchProgress.completed}/{qBatchProgress.total} 題
                            </span>
                          </div>
                        </div>
                      )}

                      <button
                        onClick={handleGenerateQuestionsViaAPI}
                        disabled={isGeneratingQs}
                        className="w-full py-4 rounded-2xl bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 disabled:opacity-50 text-white font-bold text-sm sm:text-base shadow-xl transition flex items-center justify-center gap-2"
                      >
                        <Sparkles className="w-5 h-5" />
                        <span>
                          用低 RPM 大批次模式生成 {genCount} 題 (只需 {Math.ceil(genCount / questionsPerApiCall)} 次 API 請求)
                        </span>
                      </button>
                    </div>
                  )}

                  {genSuccessMsg && (
                    <div className="bg-emerald-950/40 border border-emerald-500/40 rounded-2xl p-4 flex flex-wrap items-center justify-between gap-4">
                      <span className="text-emerald-300 text-xs sm:text-sm font-medium">{genSuccessMsg}</span>
                      <button
                        onClick={() => {
                          setMockType('daily20');
                          setActiveTab('exam');
                        }}
                        className="px-4 py-2 rounded-xl bg-emerald-500 text-slate-950 text-xs font-bold"
                      >
                        立即去做新題目 ➔
                      </button>
                    </div>
                  )}
                </div>
              </div>
            )}
          </main>

          {/* Slide-over AI Tutor Drawer */}
          {isTutorDrawerOpen && (
            <div className="fixed inset-0 z-50 flex justify-end bg-black/60 backdrop-blur-sm">
              <div className="w-full max-w-xl bg-slate-900 border-l border-slate-800 h-full flex flex-col shadow-2xl">
                <div className="p-4 sm:px-6 bg-slate-950 border-b border-slate-800 flex items-center justify-between">
                  <div className="flex items-center gap-3">
                    <Brain className="w-5 h-5 text-indigo-400" />
                    <div>
                      <h3 className="text-sm font-bold text-white">NPPE AI 導師 (支援免 API 自動複製提問)</h3>
                      <p className="text-[11px] text-slate-400">
                        {userApiKey ? '已連結你嘅 API Key' : '未入 Key 時發送會自動 Copy 問題畀你貼去 Gemini App'}
                      </p>
                    </div>
                  </div>
                  <button
                    onClick={() => setIsTutorDrawerOpen(false)}
                    className="p-2 rounded-xl bg-slate-900 text-slate-400 hover:text-white"
                  >
                    <X className="w-5 h-5" />
                  </button>
                </div>

                <div className="flex-1 overflow-y-auto p-4 sm:p-6 space-y-4">
                  {tutorMessages.map((m, i) => (
                    <div key={i} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                      <div
                        className={`max-w-[88%] rounded-2xl p-4 text-sm leading-relaxed whitespace-pre-line ${
                          m.role === 'user'
                            ? 'bg-indigo-600 text-white'
                            : 'bg-slate-950 border border-slate-800 text-slate-200'
                        }`}
                      >
                        {m.text}
                      </div>
                    </div>
                  ))}
                  {isTutorLoading && (
                    <div className="text-xs text-indigo-300 flex items-center gap-2">
                      <Loader2 className="w-4 h-4 animate-spin" /> AI 導師分析中...
                    </div>
                  )}
                </div>

                <form onSubmit={handleSendTutorMessage} className="p-4 bg-slate-950 border-t border-slate-800 flex gap-2">
                  <input
                    type="text"
                    value={tutorInput}
                    onChange={e => setTutorInput(e.target.value)}
                    placeholder="輸入問題（如無 API Key 會自動複製問題去剪貼簿）..."
                    className="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white"
                  />
                  <button
                    type="submit"
                    className="px-4 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold flex items-center gap-1.5"
                  >
                    <Send className="w-4 h-4" />
                    <span>{userApiKey ? '發送' : '複製去問'}</span>
                  </button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
